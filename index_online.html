        const cx2=x1+ux*d,cy2=y1+uy*d;
        ctx.beginPath();
        ctx.moveTo(cx2+nx*tick,cy2+ny*tick);
        ctx.lineTo(cx2-nx*tick,cy2-ny*tick);
        ctx.stroke();
      }
    }
    ctx.lineCap='round';
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  // 単独バス停(小さな青リング)
  for(const cell of B.busStopCells){
    const isStation=B.stations.includes(cell);
    let special=false;for(const k in B.facilities)if(B.facilities[k]===cell)special=true;
    if(isStation||special)continue;
    const [x,y]=cellXY(cell);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,C*0.15,0,7);ctx.fill();
    ctx.strokeStyle='#0288d1';ctx.lineWidth=2;ctx.stroke();
  }
  // 家(小さめタイル)
  for(const cell of B.houses){
    const [x,y]=cellXY(cell);
    let owner=null;
    for(const p of G.players)if(p.houses.includes(cell))owner=p;
    const t=C*0.72;
    ctx.fillStyle=owner?'#fff':'rgba(255,255,255,0.75)';
    rr(x-t/2,y-t/2,t,t,C*0.12);ctx.fill();
    if(owner){ctx.strokeStyle=owner.color;ctx.lineWidth=2.5;}
    else{ctx.strokeStyle='rgba(120,130,145,0.5)';ctx.lineWidth=1;}
    ctx.stroke();
    ctx.font=(C*0.46)+'px sans-serif';
    ctx.fillText('🏠',x,y+0.5);
  }
  // 駅・特殊施設(大きめ白タイル+色枠+影)
  const tileBig=(cell,icon,border)=>{
    const [x,y]=cellXY(cell);
    const t=C*0.9;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.25)';ctx.shadowBlur=4;ctx.shadowOffsetY=1.5;
    ctx.fillStyle='#fff';
    rr(x-t/2,y-t/2,t,t,C*0.16);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=border;ctx.lineWidth=2.5;
    rr(x-t/2,y-t/2,t,t,C*0.16);ctx.stroke();
    ctx.font=(C*0.58)+'px sans-serif';
    ctx.fillText(icon,x,y+0.5);
    // バス停兼用の青ドット
    if(B.busStopCells.includes(cell)){
      ctx.fillStyle='#0288d1';ctx.beginPath();ctx.arc(x+t*0.38,y-t*0.38,C*0.1,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+t*0.38,y-t*0.38,C*0.045,0,7);ctx.fill();
    }
  };
  for(let i=0;i<B.stations.length;i++)tileBig(B.stations[i],'🚉','#e53935');
  for(const k in B.facilities)tileBig(B.facilities[k],FAC_INFO[k].icon,'#f59f00');
  // 工事
  if(G.fx.kojiTurn===G.turn&&G.fx.kojiCell){const [x,y]=cellXY(G.fx.kojiCell);
    ctx.font=(C*0.7)+'px sans-serif';ctx.fillText('🚧',x,y);}
  // 自分の未使用目的地(緑点線+番号)
  const hp=G.players[HUMAN];
  if(hp&&hp.dests){
    hp.dests.forEach((d,i)=>{
      if(hp.usedDests.includes(i))return;
      const [x,y]=cellXY(d.cell);
      ctx.strokeStyle='#00b34d';ctx.lineWidth=3;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.arc(x,y,C*0.5,0,7);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#00b34d';ctx.beginPath();ctx.arc(x+C*0.42,y-C*0.42,C*0.17,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold '+(C*0.26)+'px sans-serif';
      ctx.fillText(String(i+1),x+C*0.42,y-C*0.41);
    });
  }
  // 各プレイヤーの「目的地」と、そこへ向かう進路を全員分表示(誰がどこへ向かうか一目で)
  for(const p of G.players){
    if(!p.active)continue;
    const [sx,sy]=cellXY(p.active.cell),[x,y]=cellXY(p.active.dest);
    // 駒→目的地のガイド線(本人は濃く、敵は薄く色分け)
    ctx.strokeStyle=p.color;ctx.globalAlpha=isLocalTurn(p.i)?0.55:0.4;
    ctx.lineWidth=isLocalTurn(p.i)?2.6:1.8;ctx.setLineDash(isLocalTurn(p.i)?[2,6]:[5,5]);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    // 目的地リング+旗
    ctx.strokeStyle=p.color;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,C*0.52,0,7);ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';
    const _fk=['red','blue','yellow','green'][p.i%4];
    const _fim=gimg('goal_flag_'+_fk);
    if(_fim){const _fs=C*1.2; ctx.drawImage(_fim, x-_fs*0.5, y-_fs*0.88, _fs, _fs);}
    else{ctx.font=(C*0.5)+'px sans-serif';ctx.fillText('🚩',x,y-C*0.52);}
    // 誰の目的地か(色つきピル)
    const nm=isLocalTurn(p.i)?'あなた':p.name;
    ctx.font='bold '+Math.max(8,C*0.2)+'px sans-serif';
    const tw=ctx.measureText(nm).width,pw=tw+C*0.2,ph=Math.max(9,C*0.28);
    const ly=Math.min(S-ph/2-1,y+C*0.55);
    ctx.fillStyle=p.color;ctx.globalAlpha=0.92;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(x-pw/2,ly-ph/2,pw,ph,ph/2):ctx.rect(x-pw/2,ly-ph/2,pw,ph);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillText(nm,x,ly+0.5);
  }
  // ハイライト(自分の色で明滅)
  if(highlight.cells.size){
    const t=Date.now();
    const w=0.5+0.5*Math.sin(t/200);            // 0..1
    const a=0.30+0.14*w;                        // 穏やかに波打つ(常に見える)
    const r=C*(0.40+0.03*w);
    const mc=(G.players[HUMAN]&&G.players[HUMAN].color)||'#e23b3b';
    const mr=parseInt(mc.slice(1,3),16),mg=parseInt(mc.slice(3,5),16),mb=parseInt(mc.slice(5,7),16);
    const fill=highlight.cls==='warn'?`rgba(255,120,0,${a})`:`rgba(${mr},${mg},${mb},${a})`;
    const line=highlight.cls==='warn'?'#ff7800':mc;
    for(const cell of highlight.cells){const [x,y]=cellXY(cell);
      ctx.fillStyle=fill;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.strokeStyle=line;ctx.lineWidth=3;
      ctx.globalAlpha=0.85+0.15*w;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
      const _q=(t%1000)/1000;
      ctx.globalAlpha=(1-_q)*0.55;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(x,y,r+_q*C*0.55,0,7);ctx.stroke();
      ctx.globalAlpha=1;
    }
    // ラベル(施設名など)を明滅の上に表示
    if(highlight.labels){
      ctx.font='bold '+Math.max(10,C*0.34)+'px sans-serif';
      for(const cell of highlight.cells){
        const txt=highlight.labels.get?highlight.labels.get(cell):highlight.labels[cell];
        if(!txt)continue;
        const [x,y]=cellXY(cell);
        const tw=ctx.measureText(txt).width;
        const ph=Math.max(13,C*0.44), pw=tw+C*0.3;
        let ly=y-C*0.78; if(ly-ph/2<2)ly=y+C*0.78;
        let lx=x; lx=Math.max(pw/2+2,Math.min(S-pw/2-2,lx));
        ctx.fillStyle='rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.roundRect?ctx.roundRect(lx-pw/2,ly-ph/2,pw,ph,ph/2):ctx.rect(lx-pw/2,ly-ph/2,pw,ph);
        ctx.fill();
        ctx.strokeStyle=line;ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#1b2334';
        ctx.fillText(txt,lx,ly+0.5);
      }
    }
  }
  // 経路プレビュー
  if(pathPreview){
    ctx.strokeStyle='rgba(46,160,67,0.9)';ctx.lineWidth=3.5;ctx.setLineDash([5,4]);
    ctx.beginPath();
    pathPreview.forEach((cell,i)=>{const [x,y]=cellXY(cell);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();ctx.setLineDash([]);
  }
  // 駒(同一マスはずらして描画)
  const occ={};
  for(const p of G.players){if(p.active)(occ[p.active.cell]=occ[p.active.cell]||[]).push(p);}
  for(const cell in occ){
    const ps=occ[cell];
    ps.forEach((p,j)=>{
      const [x0,y0]=cellXY(cell);
      const off=(j-(ps.length-1)/2)*C*0.3;
      let x=x0+off, y=y0-C*0.1;
      if(ANIM&&ANIM.pi===p.i){x=ANIM.x;y=ANIM.y-C*0.1;} // 移動中もこの駒を描き続ける
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,C*0.36,0,7);ctx.fill();
      ctx.restore();
      const fim=faceImg(p.active.card.trait);
      if(fim){
        ctx.save();
        ctx.beginPath();ctx.arc(x,y,C*0.29,0,7);ctx.clip();
        ctx.drawImage(fim,x-C*0.29,y-C*0.29,C*0.58,C*0.58);
        ctx.restore();
      }else{
        ctx.fillStyle='#fff';ctx.font='bold '+(C*0.3)+'px sans-serif';
        ctx.fillText(p.active.card.name[0],x,y+0.5);
      }
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,C*0.29,0,7);ctx.stroke();
      // 敵コマは持ち主名を小さく(自分は▼マーカーがあるので不要)
      if(!p.isHuman&&(!ANIM||ANIM.pi!==p.i)){
        ctx.font='bold '+Math.max(7,C*0.19)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        const nm=p.name,tw=ctx.measureText(nm).width,pw=tw+C*0.16,ph=Math.max(8,C*0.24),ny=y+C*0.42;
        ctx.fillStyle=p.color;ctx.globalAlpha=0.92;
        ctx.beginPath();ctx.roundRect?ctx.roundRect(x-pw/2,ny-ph/2,pw,ph,ph/2):ctx.rect(x-pw/2,ny-ph/2,pw,ph);ctx.fill();
        ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillText(nm,x,ny+0.5);
      }
      if(p.isHuman){
        ctx.strokeStyle='#ffb300';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(x,y,C*0.44,0,7);ctx.stroke();
        // ▼マーカー: 先端を軸にコマのように水平回転しつつ軽く上下
        const t=Date.now();
        const anim=!!pulseTimer;
        const bob=anim?Math.sin(t/260)*C*0.08:0;
        const tipY=y-C*0.52+bob;   // 三角の先端(=回転軸)
        let sx=anim?Math.cos(t/220):1;  // 水平方向のつぶれで回転を表現
        if(Math.abs(sx)<0.12)sx=0.12*Math.sign(sx||1);
        const s=C*(anim?0.32:0.26);
        ctx.save();
        ctx.translate(x,tipY);
        ctx.scale(sx,1);
        ctx.beginPath();
        ctx.moveTo(0,0);                 // 先端(下)
        ctx.lineTo(-s*0.85,-s*1.5);      // 左上
        ctx.lineTo(s*0.85,-s*1.5);       // 右上
        ctx.closePath();
        ctx.fillStyle='#ffb300';ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2/Math.abs(sx);ctx.stroke();
        ctx.restore();
        if(anim){
          ctx.fillStyle='rgba(255,179,0,0.95)';
          ctx.font='bold '+(C*0.34)+'px sans-serif';
          ctx.fillText('あなた',x,tipY-s*1.9);
        }
      }
    });
  }
  // 着地リング(ぽよんと広がって消える)
  if(LAND){
    const q=Math.min(1,(performance.now()-LAND.t0)/340);
    ctx.strokeStyle='rgba(255,213,79,'+(0.75*(1-q))+')';
    ctx.lineWidth=3.5*(1-q)+1;
    ctx.beginPath();ctx.arc(LAND.x,LAND.y-C*0.1,C*(0.3+0.55*q),0,7);ctx.stroke();
  }
  // 自分の駒の乗車待ちバッジ(バス停・駅にいるとき)
  const hb=G.players[HUMAN];
  if(hb&&hb.active&&!ANIM){
    const c0=hb.active.cell;
    const sSta=B.stations.includes(c0),sStop=B.busStopCells.includes(c0);
    const noV=['uchujin','inou'].includes(hb.active.card.trait);
    if((sSta||sStop)&&!noV){
      const ready=hb.active.cellSince<G.turn;
      const unkyu=(G.fx.unkyuUntil||-1)>=G.turn;
      const icons=(sSta&&!unkyu?'🚃':'')+(sStop?'🚌':'');
      let txt,bg,line2,fg;
      if(!icons){txt='🚫運休中';bg='rgba(255,255,255,0.95)';line2='#c62828';fg='#c62828';}
      else if(ready){txt=icons+'乗れる!';bg='rgba(46,160,67,0.95)';line2='#1b5e20';fg='#fff';}
      else{txt='⏳'+icons+'待機中…';bg='rgba(255,255,255,0.95)';line2='#8a97ab';fg='#1b2334';}
      const [px2,py2]=cellXY(c0);
      ctx.font='bold '+Math.max(9,C*0.27)+'px sans-serif';
      const tw2=ctx.measureText(txt).width,pw2=tw2+C*0.3,ph2=Math.max(13,C*0.42);
      const bx3=Math.max(pw2/2+2,Math.min(S-pw2/2-2,px2)),by3=py2+C*0.72;
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(bx3-pw2/2,by3-ph2/2,pw2,ph2,ph2/2):ctx.rect(bx3-pw2/2,by3-ph2/2,pw2,ph2);ctx.fill();
      ctx.strokeStyle=line2;ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(txt,bx3,by3+0.5);
    }
  }
  // 移動の粒子(砂ぼこり・煙・湯気・きらめき)
  if(PARTICLES.length){
    const now=performance.now();
    for(let n=PARTICLES.length-1;n>=0;n--){
      const p=PARTICLES[n],age=now-p.t0;
      if(age>=p.life){PARTICLES.splice(n,1);continue;}
      const q=age/p.life, a=(1-q);
      const px=p.x+p.vx*age, py=p.y+p.vy*age, r=p.size*(0.6+q);
      if(p.type==='spark'){ctx.fillStyle='rgba('+p.color+','+(a*0.95)+')';ctx.beginPath();ctx.arc(px,py,r*0.55,0,7);ctx.fill();}
      else{ctx.fillStyle='rgba('+p.color+','+(a*0.62)+')';ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();}
    }
  }
  // 移動アニメのオーバーレイ(発光する軌跡+車両+スピード線+アイコン)
  if(ANIM){
    const {x,y,base,ux,uy,speed,f,fx,pts,mode}=ANIM;
    // 発光する軌跡(電車はレール風の破線)
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowColor=fx.col;ctx.shadowBlur=fx.glow||6;
    ctx.strokeStyle=fx.col;ctx.lineWidth=Math.max(4,C*0.17);
    ctx.setLineDash(mode==='train'?[C*0.36,C*0.28]:[]);
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    const fi=Math.floor(f);
    for(let j=1;j<=fi;j++)ctx.lineTo(pts[j][0],pts[j][1]);
    ctx.lineTo(x,base);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
    // スピード線(速度と手段で本数・長さ。濃淡2本重ねで視認性UP)
    const sp=Math.min(1.5,speed/(C*0.45));
    if(fx.streak){
      ctx.lineCap='round';
      for(let sN=0;sN<fx.streak;sN++){
        const off=(sN-(fx.streak-1)/2)*C*0.16;
        const sxp=x-ux*C*0.48-uy*off, syp=base-uy*C*0.48+ux*off;
        const ln=C*(0.3+0.6*sp)+sN*C*0.05;
        ctx.strokeStyle='rgba(50,60,78,0.5)';ctx.lineWidth=Math.max(2,C*0.07);
        ctx.beginPath();ctx.moveTo(sxp,syp);ctx.lineTo(sxp-ux*ln,syp-uy*ln);ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=Math.max(1,C*0.03);
        ctx.beginPath();ctx.moveTo(sxp,syp);ctx.lineTo(sxp-ux*ln,syp-uy*ln);ctx.stroke();
      }
    }
    ctx.textAlign='center';ctx.textBaseline='middle';
    // 残像(進行方向の後ろに薄い乗り物を重ねてスピード感)
    if(fx.ghost){
      ctx.font=(C*0.82)+'px sans-serif';
      for(let g=fx.ghost;g>=1;g--){
        const gx=x-ux*C*(0.42*g), gy=(y-C*0.6)-uy*C*(0.42*g);
        ctx.save();ctx.translate(gx,gy);
        if(Math.abs(ux)>=Math.abs(uy))ctx.scale(ux>0?-1:1,1);
        ctx.globalAlpha=0.28/g;ctx.fillText(fx.icon,0,0);ctx.restore();
      }
      ctx.globalAlpha=1;
    }
    // 電車の後続車両
    if(fx.cars){
      ctx.font=(C*0.66)+'px sans-serif';
      for(let cc=1;cc<=fx.cars;cc++){
        const cx=x-ux*C*0.72*cc, cy=base-C*0.6-uy*C*0.72*cc;
        ctx.save();ctx.translate(cx,cy);if(Math.abs(ux)>Math.abs(uy))ctx.scale(ux>0?-1:1,1);
        ctx.globalAlpha=0.92;ctx.fillText(fx.icon,0,0);ctx.restore();
      }
      ctx.globalAlpha=1;
    }
    // 乗り物/歩行アイコン(速度でスカッシュ&ストレッチ, 向き反転, 徒歩は上下)
    ctx.save();
    ctx.translate(x, y-C*0.6);
    const stretch=1+Math.min(0.4,sp*0.32), squash=1-Math.min(0.2,sp*0.16);
    if(Math.abs(ux)>=Math.abs(uy))ctx.scale((ux>0?-1:1)*stretch,squash);
    else ctx.scale(1+ (stretch-1)*0.4, 1+(stretch-1)*0.6);
    ctx.font=(C*0.86)+'px sans-serif';
    ctx.fillText(fx.icon,0,0);
    ctx.restore();
  }
  // 駒タップ情報(目的地明滅+あと◯マス吹き出し)
  if(INSPECT&&Date.now()<INSPECT.until&&G.players[INSPECT.pi]&&G.players[INSPECT.pi].active){
    const p=G.players[INSPECT.pi],a=p.active;
    const t2=Date.now(),w2=0.5+0.5*Math.sin(t2/140);
    const [gx,gy]=cellXY(a.dest),[sx2,sy2]=cellXY(a.cell);
    // 現在地→目的地の点線
    ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.moveTo(sx2,sy2);ctx.lineTo(gx,gy);ctx.stroke();ctx.setLineDash([]);
    // 目的地明滅リング
    ctx.strokeStyle=p.color;ctx.lineWidth=3+2*w2;ctx.globalAlpha=0.45+0.55*w2;
    ctx.beginPath();ctx.arc(gx,gy,C*(0.55+0.16*w2),0,7);ctx.stroke();ctx.globalAlpha=1;
    ctx.font='bold '+Math.max(9,C*0.28)+'px sans-serif';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.9)';
    ctx.strokeText('🎯目的地',gx,gy-C*0.8);
    ctx.fillStyle=p.color;ctx.fillText('🎯目的地',gx,gy-C*0.8);
    // 吹き出し
    const d=walkDistUI(a.cell,a.dest);
    const txt=`${a.card.tname}・あと${d>=0?d+'マス':'?'}`;
    ctx.font='bold '+Math.max(10,C*0.32)+'px sans-serif';
    const tw=ctx.measureText(txt).width,pw=tw+C*0.4,ph=Math.max(15,C*0.5);
    let bx2=sx2,by2=sy2-C*0.95;if(by2-ph/2<2)by2=sy2+C*0.95;
    bx2=Math.max(pw/2+2,Math.min(S-pw/2-2,bx2));
    ctx.fillStyle='rgba(255,255,255,0.96)';
    ctx.beginPath();ctx.moveTo(sx2,sy2-C*0.45);ctx.lineTo(bx2-C*0.12,by2+ph/2-1);ctx.lineTo(bx2+C*0.12,by2+ph/2-1);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.roundRect?ctx.roundRect(bx2-pw/2,by2-ph/2,pw,ph,ph/2):ctx.rect(bx2-pw/2,by2-ph/2,pw,ph);ctx.fill();
    ctx.strokeStyle=p.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(bx2-pw/2,by2-ph/2,pw,ph,ph/2):ctx.rect(bx2-pw/2,by2-ph/2,pw,ph);ctx.stroke();
    ctx.fillStyle='#1b2334';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(txt,bx2,by2+0.5);
  }
}

// ---- 部品 ----
function toast(msg,ms){return new Promise(res=>{
  const t=$('toast');t.textContent=msg;t.classList.add('on');
  setTimeout(()=>{t.classList.remove('on');res();},ms||1400);
});}
function setStatus(html){$('status').innerHTML=html;}
function stackHTML(n,cls){
  const shown=Math.min(n,8);
  let s='<span class="cstack">';
  for(let i=0;i<shown;i++)s+=`<i class="cback ${cls}" style="margin-left:${i?-7:0}px"></i>`;
  s+=`<b>${n}</b></span>`;
  return s;
}
function renderPlayers(){
  const goal=G.goalPts||18;
  const order=currentRanking(G); // 得点順(上位が前)
  $('players').innerHTML=order.map((p,idx)=>{
    const rank=idx+1;
    const frac=Math.max(0,Math.min(100,Math.round(p.usedPts/goal*100)));

function showPeek(card,t){
  const pk=$('peek'); if(!pk||!card)return;
  const html=(t==='c')?charCardHTML(card):actionCardHTML(card);
  const canPlay=(t==='a')&&HAND_ACTION&&HAND_ACTION.pi===HUMAN;
  pk.innerHTML=`<div>${html}</div><div class="pkhint">${canPlay?'指を離す→戻る ／ 上にスワイプ→場に出す':'指を離すと戻ります'}</div>`;
  pk.classList.add('on'); if(typeof seDraw==='function')seDraw();
}
function hidePeek(){const pk=$('peek'); if(pk){pk.classList.remove('on');pk.innerHTML='';}}
function playCardSwipe(el,card){
  const ha=HAND_ACTION; if(!ha||ha.pi!==HUMAN)return;
  if(typeof seCard==='function')seCard();
  el.style.transition='transform .18s ease, opacity .18s ease';
  el.style.transform='translateY(-170px) scale(1.15)';
  el.style.opacity='0';
  setTimeout(async()=>{
    if(card&&card.pass){ if(typeof drawFX==='function'){try{await drawFX();}catch(e){}} ha.res({cardId:null}); }
    else if(card){ ha.res({cardId:card.id}); }
  },160);
}
function bindCardGesture(el){
  const t=el.dataset.t; // 'c'=キャラ 'a'=アクション 'p'=パス
  const playable=()=>((t==='a'||t==='p')&&HAND_ACTION&&HAND_ACTION.pi===HUMAN);
  const getCard=()=>{const p=G.players[HUMAN]; if(t==='p')return {pass:true}; return (t==='c'?p.charHand:p.actionHand).find(x=>x.id===el.dataset.id);};
  const reset=()=>{el.classList.remove('lift');el.style.transform='';el.style.opacity='';el.style.transition='';};
  let sx=0,sy=0,moved=false,peeked=false,lp=null,active=false;
  el.onpointerdown=(e)=>{
    active=true;moved=false;peeked=false;sx=e.clientX;sy=e.clientY;
    if(playable()){ try{el.setPointerCapture(e.pointerId);}catch(_){} el.classList.add('lift'); }
    lp=setTimeout(()=>{ if(active&&!moved){peeked=true; const c=getCard(); if(c&&!c.pass)showPeek(c,t);} },420);
  };
  el.onpointermove=(e)=>{
    if(!active)return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>8||Math.abs(dy)>8){moved=true; if(lp){clearTimeout(lp);lp=null;}}
    if(playable()&&moved&&dy<0){
      if(peeked){hidePeek();peeked=false;}
      const lift=Math.max(-150,dy);
      el.style.transform=`translateY(${lift}px) scale(${(1.07+Math.min(0.13,(-lift)/260)).toFixed(3)})`;
      el.style.opacity = dy<-45 ? String(Math.max(0.35,1+(dy+45)/220)) : '1';
    }
  };
  const finish=(e)=>{
    if(!active)return; active=false;
    if(lp){clearTimeout(lp);lp=null;}
    const dy=((e&&e.clientY!=null)?e.clientY:sy)-sy;
    if(playable()&&dy<=-50){ if(peeked){hidePeek();peeked=false;} playCardSwipe(el,getCard()); return; }
    if(peeked){peeked=false;hidePeek();}
    reset();
  };
  el.onpointerup=finish;
  el.onpointercancel=()=>{active=false;if(lp){clearTimeout(lp);lp=null;}if(peeked){peeked=false;hidePeek();}reset();};
}

function pickCell(valid,title,allowCancel,labels){
  return new Promise(res=>{
    highlight.cells=new Set(valid);highlight.cls='';highlight.labels=labels||null;
    startPulse();
    setStatus(title);
    let html=`<div class="ptitle">${title}</div><div class="sm">✨ 光っているマスをタップ</div>`;
    if(allowCancel)html+=`<button class="pbtn warn" id="pcancel">やめる</button>`;
    $('panel').innerHTML=html;
    dbg('行先待ち('+valid.length+')');
    function cleanup(){boardTapHandler=null;highlight.cells=new Set();highlight.labels=null;stopPulse();}
    if(allowCancel)$('pcancel').onclick=()=>{cleanup();res(null);};
    boardTapHandler=(cell,wx,wy)=>{
      if(cell&&highlight.cells.has(cell)){cleanup();res(cell);return;}
      if(wx!=null&&highlight.cells.size){ let best=null,bd=1e9;
        for(const hc of highlight.cells){const [cx,cy]=cellXY(hc);const d=Math.hypot(cx-wx,cy-wy);if(d<bd){bd=d;best=hc;}}
        if(best&&bd<CV.cell*1.15){cleanup();res(best);}
      }
    };
  });
}

// ---- セットアップ ----
async function runSetup(){
  const taken=new Set(); // 家+目的地に使われたセル
  if(G.setupMode==='auto'){
    for(const pi of turnOrder(G)){
      const s=aiSetup(G,pi,taken);
      s.houses.forEach(h=>taken.add(h));
      G.players[pi].houses=s.houses;
    }
    for(const pi of turnOrder(G)){
      const nxt=(pi+1)%G.players.length;
      const d=(G.destMode==='random')?randomDests(G,taken):aiSetup(G,pi,taken).dests;
      d.forEach(x=>taken.add(x.cell));
      G.players[nxt].dests=d;
    }
    const hp0=G.players[HUMAN];
    log(G,`あなたの目的地: ${hp0.dests.map(d=>d.label).join(' / ')}`);
    refresh();
    await modal(`<div class="ptitle">準備完了!</div>
      <div class="sm" style="font-size:13px;line-height:1.9">
      家と目的地は自動で決まりました。<br><br>
      🏠 <b>あなたの家(赤い枠)</b>: ${hp0.houses.map(fmtCell).join('・')}<br>
      🎯 <b>目的地(緑の点線◯)</b>: ${hp0.dests.map((d,i)=>NUMSYM[i]+d.label).join(' ')}<br><br>
      3人のキャラを、家から目的地へ送り届けよう。</div>`,
      [{label:'OK',value:1,cls:'primary'}]);
    return;
  }
  for(const pi of turnOrder(G)){
    const p=G.players[pi];
    // --- 家 --- (online: pi の担当がUIで選び送信 / 相手は受信)
    const houses = await decideData(pi,'home', ()=>uiPickHomes(pi,taken), ()=>aiSetup(G,pi,taken).houses);
    houses.forEach(h=>taken.add(h));
    p.houses=houses;
    refresh();
  }
  // --- 目的地 ---
  if(G.destMode==='random'){
    for(const pi of turnOrder(G)){
      G.players[pi].dests=randomDests(G,taken);
      G.players[pi].dests.forEach(d=>taken.add(d.cell));
    }
    log(G,'目的地はランダムに決定された');
  }else{
    for(const pi of turnOrder(G)){
      const nxt=G.players[(pi+1)%G.players.length];
      // pi が (pi+1) の目的地を指名。online: pi の担当がUIで選び送信 / 相手は受信
      const dests = await decideData(pi,'dest', ()=>uiPickDests(pi,taken), ()=>aiSetup(G,pi,taken).dests);
      dests.forEach(d=>taken.add(d.cell));
      nxt.dests=dests;
      refresh();
    }
  }
  const hp=G.players[HUMAN];
  log(G,`あなたの目的地: ${hp.dests.map(d=>d.label).join(' / ')}`);
  refresh();
}

// ---- メインループ ----
async function gameLoop(){
  while(!G.winner){
    saveGame(); // ターン境界で自動セーブ(タイトルの「つづきから」で再開可)
    netTurnSync(); // ターン境界の同期照合(online)
    for(const pi of turnOrder(G)){
      const p=G.players[pi];
      if(!(p.needsPlacement&&p.usedPts<(G.goalPts||18)&&p.charHand.length>0&&p.dests.some((d,i)=>!p.usedDests.includes(i))))continue;
      const pl=await decideData(pi,'place'+G.turn, ()=>humanPlace(pi), ()=>aiPlace(G,pi));
      placeCharacter(G,pi,pl.charId,pl.house,pl.destIdx);
      const cc=p.usedChars[p.usedChars.length-1];
      if(cc && !isLocalTurn(pi))await cardFX(charCardHTML(cc),p.name+'のキャラが出発',p.color);
      refresh();
    }
    if(G.noActions){setStatus(`ターン${G.turn} 移動フェイズ`);await phaseBanner(`ターン ${G.turn} ─ 🚶 移動`);}else{
    setStatus(`ターン${G.turn} アクションフェイズ`);
    await phaseBanner(`ターン ${G.turn} ─ 🃏 アクション`);
    const choices={};
    // 同時選択(隠し札の公平性): 各自ローカルはUI・相手は受信を並列で
    await Promise.all(turnOrder(G).map(pi=>
      decideData(pi,'act'+G.turn, ()=>humanAction(pi), ()=>aiChooseAction(G,pi)).then(v=>{choices[pi]=v;})
    ));
    const played=Object.entries(choices).filter(([pi,c])=>c.cardId);
    if(played.length){setStatus('アクション同時公開！');await phaseBanner('🃏 同時公開!');}
    const gen=actionPhaseGen(G,choices);
    const fxShown=new Set();
    const showFX=async(pi,card)=>{
      if(fxShown.has(card.id))return;
      fxShown.add(card.id);
      await cardFX(actionCardHTML(card),G.players[pi].name+'の一手!',G.players[pi].color);
    };
    let r=gen.next();
    while(!r.done){
      const ev=r.value;
      if(ev.type==='target'){
        await showFX(ev.pi,ev.card);
        const target=await decideData(ev.pi,'tgt'+G.turn+'_'+ev.card.id,
          ()=>humanTarget(ev.pi,ev.card,ev.revealed),
          ()=>((choices[ev.pi]&&choices[ev.pi].target)||aiActionTarget(G,ev.pi,ev.card,ev.revealed)));
        refresh();
        r=gen.next(target);
      }else if(ev.type==='resolved'){
        await showFX(ev.pi,ev.card);
        refresh();
        await showCardResult(ev.pi,ev.card,ev.target);
        r=gen.next();
      }else if(ev.type==='cancelled'){
        await cancelFX(ev.pi,ev.card);
        refresh();
        r=gen.next();
      }else r=gen.next();
    }
    refresh();
    await phaseBanner('🚶 移動フェイズ');
    }
    for(const pi of turnOrder(G)){
      const p=G.players[pi];
      const localTurn=isLocalTurn(pi);
      const nMoves=(p.fx.nikaiTurn===G.turn)?2:1;
      if(p.active){
        TURN_PI=pi;renderPlayers();
        if(!canMoveThisTurn(G,pi)){
          // 「とばされた感」対策: なぜ動けないかをちゃんと見せる
          const a=p.active;
          let why='今回は移動できません';
          if(p.fx.frozenTurn===G.turn)why=`「お疲れ様！！」の効果で、${localTurn?'あなたの':p.name+'の'}「${a.card.name}」は今回おやすみ 💤`;
          else if(a.card.trait==='chikoku'&&G.turn<a.placedTurn+2)why=`遅刻魔「${a.card.name}」はまだ寝ています(移動できるまであと${a.placedTurn+2-G.turn}ターン)`;
          if(localTurn)await autoNotice(`<div class="ptitle">💤 移動スキップ</div><div class="sm" style="font-size:13px;line-height:1.8">${why}</div>`,2400);
          else{setStatus(`${p.name}: 移動スキップ(${a.card.tname})`);await sleep(900);}
          camFollowMode=false;camReset();TURN_PI=-1;renderPlayers();
          continue;
        }
        camFollowMode=!localTurn;
        camFocusCell(p.active.cell, localTurn?1.7:2.0);
        if(localTurn){await phaseBanner('▶ あなたの番'); await sleep(300); camReset();}
        else setStatus(`${p.name}の移動…`);
      }
      for(let mi=0;mi<nMoves;mi++){
        if(!p.active)break;
        const mv=await decideData(pi,'mv'+G.turn+'_'+mi, ()=>humanMove(pi), ()=>aiMove(G,pi));
        const res=await applyMoveDescriptor(pi, mv, localTurn);
        refresh();
        if(res==='pass')break;
      }
      TURN_PI=-1;renderPlayers();
      camFollowMode=false;
      if(!localTurn){await sleep(300);camReset();}
      await sleep(360);
    }
    // 終了フェイズ: アクションカードは最大5枚(超過分は自動で捨てる)
    for(const pi of turnOrder(G)){
      const dumped=endPhaseDiscard(G,G.players[pi]);
      if(dumped.length&&G.players[pi].isHuman){
        renderHand();
        await autoNotice(`<div class="ptitle">🖐 手札は最大5枚</div><div class="sm" style="font-size:12.5px;line-height:1.7">アクションカードが6枚以上になったので、${dumped.map(c=>'「'+c.name+'」').join('')}を捨てました。</div>`,1900);
      }
    }
    if(endTurn(G))break;
    refresh();
  }
  refresh();
  showResult();
}

   '選んだキャラを家から出発させ、目的地(緑の◯)を1つ選びます。<br>キャラの特徴と目的地の位置の相性が大事です。');
  const freeH=p.houses.filter(h=>!p.usedHouses.includes(h));

  const unused=p.dests.map((d,i)=>({d,i})).filter(x=>!p.usedDests.includes(x.i));

  return {charId:ch.id, house, destIdx:di};
}

async function humanTarget(pi,card,revealed){
  refresh();
  if(card.target==='character'){
    const items=[];
    for(const q of G.players)if(q.active)items.push({label:`${q.name}の「${q.active.card.name}」`,value:{charPi:q.i}});
    if(!items.length)return null;
    return await panelChoose(`「${card.name}」の対象キャラを選ぶ`,items);
  }
  if(card.target==='cell'){
    const B=G.board,valid=[];
    for(let x=0;x<B.W;x++)for(let y=0;y<B.H;y++){const c=x+','+y;
      if(!facilityAt(B,c))valid.push(c);}
    const c=await pickCell(valid,`「${card.name}」のマスを選ぶ`);
    return {cell:c};
  }
  if(card.target==='card'){
    const items=revealed.filter(r=>r.card.id!==card.id).map(r=>({label:`${G.players[r.pi].name}の「${r.card.name}」`,value:{cancelId:r.card.id}}));
    if(!items.length)return null;
    items.push({label:'何もしない',value:null});
    return await panelChoose('無効にするカードを選ぶ',items);
  }
  if(card.target==='road'){
    const B=G.board,valid=[];
    for(let x=0;x<B.W;x++)for(let y=0;y<B.H;y++){const c=x+','+y;
      if(facilityAt(B,c))continue;
      if(ROAD_SHAPES[card.key].some(d=>canChangeRoad(G,c,d)))valid.push(c);
    }
    const cell=await pickCell(valid,`「${card.name}」: 変更するマスを選ぶ`,true);
    if(!cell)return null;
    const dirs=await panelChoose('向きを選ぶ',ROAD_SHAPES[card.key].filter(d=>canChangeRoad(G,cell,d))
      .map(d=>({label:d.map(x=>({N:'上',E:'右',S:'下',W:'左'})[x]).join('・'),value:d})));
    return {cell,dirs};
  }
  return null;
}

    const mv=cellMap.get(c);
    let payment=null;
    if(mv.mode==='ride'){
      const pays=ridePayOptions(G,pi);
      const items2=[];
      const freeP=pays.find(x=>x.type==='free');
      if(freeP)items2.push({label:'🎫 無料クーポンで配車',sub:'ライドオンタイム効果',value:freeP,cls:'primary'});
      if(!G.noActions&&pays.some(x=>x.type==='action'))
        items2.push({label:'🎴 アクションカード1枚を捨てて配車',sub:'手札から自動で1枚使います',value:{type:'action',auto:true}});
      for(const pay of pays.filter(x=>x.type==='char')){
        const cc=p.charHand.find(x=>x.id===pay.cardId);
        items2.push({label:`キャラ「${cc.name}」(${cc.tname})を手放して配車`,value:pay});
      }
      if(!items2.length){await modal('<div class="sm">いま配車に使えるカードがありません。</div>',[{label:'OK',value:0}]);continue;}
      items2.push({label:'やめる',value:null,cls:'warn'});
      await hintOnce('ride','ライドシェアの配車', G.noActions
        ?'配車には<b>キャラカード1枚</b>を手放します(原作準拠)。使う予定のないキャラを出すのがコツ。'
        :'配車には<b>アクションカード1枚</b>が必要です。手札から自動で価値の低い1枚を使います。');
      payment=await panelChoose(((typeof CARD_IMG!=='undefined'&&CARD_IMG.ticket_ride)?`<img class="tkt" src="${CARD_IMG.ticket_ride}">`:'')+'配車コストを選ぶ',items2);
      if(!payment)continue;
    }
    return {move:mv, payment};
  }
  }finally{stopPulse(); G.rng.s=_rngS;}
}

/* ==========================================================================
   オンライン対戦(ロックステップ同期) — 開発中 / index_online.html 専用
   方式: 両端末で同じゲームを走らせ、各プレイヤーの「手」だけを交換する。
   乱数はシード固定なので、同じ手を入れれば盤面は完全一致する。
   まずは「同一PCの別タブ」を BroadcastChannel でつないで動作確認する。
   ========================================================================== */
const NET = {
  mode:'off',      // 'off' | 'local' | 'firebase'
  code:null, seat:0, isHost:false,
  ch:null,         // BroadcastChannel(ローカルテスト)
  cfg:null,
  inbox:{}, waiters:{}, _handlers:{}
};
function netOnline(){ return NET.mode!=='off'; }
function strHash(s){ s=String(s); let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return ('00000000'+h.toString(16)).slice(-8); }
// 準備完了時に双方のゲーム状態を部分ごとにハッシュ化(logは除外=表示のみで状態でないため)
function syncReport(){
  const P=G.players; const h=(x)=>strHash(JSON.stringify(x));
  return {
    rng:  h(G.rng&&G.rng.s),
    house:h(P.map(p=>p.houses||[])),
    dest: h(P.map(p=>(p.dests||[]).map(d=>d.cell))),
    hand: h(P.map(p=>[(p.charHand||[]).map(c=>c.id),(p.actionHand||[]).map(c=>c.id)])),
    deck: h([(G.charDeck||[]).map(c=>c.id),(G.actionDeck||[]).map(c=>c.id)])
  };
}
function showSyncResult(mine, other){
  const parts=['rng','house','dest','hand','deck'];
  const diffs=parts.filter(k=>mine[k]!==other[k]);
  if(diffs.length===0){
    netOverlay(`✅ <b style="color:#4fc3f7;font-size:18px">同期成功！</b><br><span class="sm">両端末のゲーム状態が完全一致しました(乱数・家・目的地・手札・山札)。この土台の上に対戦ターンを実装できます。</span>`);
  }else{
    netOverlay(`❌ <b style="color:#ff6b6b;font-size:18px">不一致</b>: 食い違い→ <b>${diffs.join(' / ')}</b><br><span class="sm">この赤字の部分名を私(開発者)に伝えてください。原因を特定して直します。</span>`);
  }
}
// online用「おまかせ」: G.rngを使わず(Math.random)有効なマスを選ぶ。結果は送信されるので決定論に影響しない
function autoPickHomes(pi, taken){
  const pool=G.board.houses.filter(h=>!taken.has(h)); const out=[];
  for(let k=0;k<3&&pool.length;k++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}
function autoPickDests(pi, taken){
  const pool=destCandidates(G).filter(d=>!taken.has(d.cell)); const out=[]; const n=destCount(G);
  for(let k=0;k<n&&pool.length;k++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}

// ---- トランスポート(ローカル: 別タブ) ----
function netOpenLocal(code){
  try{ NET.ch = new BroadcastChannel('rsg_room_'+code); }
  catch(e){ alert('この環境はオンライン対戦(BroadcastChannel)に未対応です'); return; }
  NET.ch.onmessage = (e)=> netHandle(e.data);
}
function netSendRaw(msg){ if(NET.mode==='local' && NET.ch) NET.ch.postMessage(msg); }
function netHandle(msg){
  if(!msg || !msg.t) return;
  if(msg.t==='decision'){
    NET.inbox[msg.key]=msg.payload;
    const w=NET.waiters[msg.key]; if(w){ delete NET.waiters[msg.key]; w(msg.payload); }
    return;
  }
  const h=NET._handlers[msg.t]; if(h) h(msg);
}
function netSendDecision(key,payload){ netSendRaw({t:'decision',key,payload}); }
function netRecvDecision(key){
  if(key in NET.inbox) return Promise.resolve(NET.inbox[key]);
  return new Promise(res=>{ NET.waiters[key]=res; });
}

// ---- 画面下の通知オーバーレイ ----
function netOverlay(html){
  let el=document.getElementById('netov');
  if(!el){ el=document.createElement('div'); el.id='netov';
    el.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:rgba(16,20,28,.96);color:#e8ecf4;padding:14px 16px;text-align:center;border-top:2px solid #4fc3f7;font-size:15px;line-height:1.7';
    document.body.appendChild(el); }
  el.innerHTML=html; el.style.display='block';
}
function netOverlayOff(){ const el=document.getElementById('netov'); if(el) el.style.display='none'; }

// ---- ロビー ----

  try{ SND.init(); }catch(e){}
  const v = await modal(`<div class="ptitle">🌐 オンライン対戦(2人・テスト中)</div>

    [{label:'部屋を作る(ホスト)',value:'host',cls:'primary'},

function newRoomCode(){ return (''+(1000+Math.floor(Math.random()*9000))); }
function hostRoom(){
  const code=newRoomCode();
  NET.mode='local'; NET.code=code; NET.seat=0; NET.isHost=true;
  NET.cfg={ seed:(Math.floor(Math.random()*1e9)), size:15, mode:'hard', dmode:'pick', smode:'manual' };
  netOpenLocal(code);
  NET._handlers['join']=()=>{
    netSendRaw({t:'config',cfg:NET.cfg});
    if(!(G&&G.online)) enterOnlineMatch(NET.cfg,0);
  };
  netOverlay(`あいことば <b style="font-size:30px;color:#4fc3f7;letter-spacing:3px">${code}</b><br>
    <span class="sm">相手にこの4桁を伝え、「部屋に入る」で入力してもらってください。<br>相手が入ると自動で開始します。</span>`);
}
async function joinRoom(){
  const code=(window.prompt('あいことば(4桁)を入力','')||'').trim();
  if(!code) return;
  NET.mode='local'; NET.code=code; NET.seat=1; NET.isHost=false;
  netOpenLocal(code);
  NET._handlers['config']=(m)=>{ if(!(G&&G.online)){ NET.cfg=m.cfg; enterOnlineMatch(m.cfg,1); } };
  netOverlay(`あいことば <b>${code}</b> に接続中…<br><span class="sm">ホストの開始を待っています</span>`);
  netSendRaw({t:'join'});
  setTimeout(()=>netSendRaw({t:'join'}),300);
  setTimeout(()=>netSendRaw({t:'join'}),1000);
}

// ---- 対局開始(両端末で同一シードから同じ初期状態を作る) ----
async function enterOnlineMatch(cfg, seat){
  if(G&&G.online) return; // 二重起動防止
  NET.seat=seat; NET.cfg=cfg; if(NET.mode==='off') NET.mode='local';
  const M=MODES[cfg.mode];
  // 名前は両端末で完全に同一にする(状態一致=チェックサム一致のため)。自分がどちらかは seat で管理。
  const players=[{isHuman:true,name:'ホスト'},{isHuman:true,name:'ゲスト'}];
  G=newGame({ mapData:cfg.size===19?MAP_DATA_19:MAP_DATA_15, players, seed:cfg.seed,
    allowTraits:M.allowTraits, allowActions:M.allowActions, noActions:M.noActions,
    destPool:M.destPool, aiNoise:0, drawLuck:0, goalPts:M.goalPts||18 });
  G.destMode=cfg.dmode; G.setupMode=cfg.smode; G.mode=cfg.mode; G.online=true;
  HUMAN=seat; CV.zoom=1; HINTS_ON=false; // オンラインはヒント無効(hintOnceのブロッキングでHAND_ACTION未設定=スワイプ不可を防ぐ)
  show('screen-game'); setupCanvas(); refresh();
  // 相手からの同期照合を受け取るハンドラ
  NET._handlers['sync']=(m)=>{ if(NET._mySync) showSyncResult(NET._mySync, m.rep); else NET._pendingSync=m.rep; };
  NET._handlers['tsync']=(m)=>{ const mine=NET._turnMine; if(mine&&mine.turn===m.turn) netTurnCompare(mine.rep, m.rep); else NET._turnPending=m; };
  netOverlay(`✅ 接続OK / あなたは <b>${seat===0?'ホスト(先手側)':'ゲスト(後手側)'}</b><br><span class="sm">準備フェーズを始めます…(家→目的地の指名→ドラフト)</span>`);
  try{
    await runSetup();
    await runDraft();
    if(!G.noActions) dealActions(G);
    refresh();
    // 準備完了: 双方のゲーム状態を自動照合(logは無視)
    NET._mySync = syncReport();
    netSendRaw({t:'sync', rep:NET._mySync});
    if(NET._pendingSync){ showSyncResult(NET._mySync, NET._pendingSync); NET._pendingSync=null; }
    else netOverlay(`準備完了 / あなた=<b>${seat===0?'ホスト':'ゲスト'}</b><br><span class="sm">相手と状態を照合しています…</span>`);
    // 対戦ターン開始(1.5秒だけ同期結果を見せてから)
    await sleep(1500); netOverlayOff();
    gameLoop();
  }catch(e){ netOverlay('⚠ エラー: '+(e&&e.message)); throw e; }
}

// ---- 決定ブローカー(次段階で各決定ポイントから呼ぶ) ----
function seatIsLocal(pi){ return !netOnline() || pi===NET.seat; }
function netDecideKey(tag,pi){ return (NET.cfg?NET.cfg.seed:0)+':'+tag+':'+pi; }
async function netDecide(pi, tag, localFn){
  if(!netOnline()) return await localFn();
  const key=netDecideKey(tag,pi);
  if(pi===NET.seat){
    const v=await localFn();
    netSendDecision(key,v);
    return v;
  }else{
    netOverlay(`⌛ 相手(${(G&&G.players[pi])?G.players[pi].name:''})の操作を待っています…`);
    const v=await netRecvDecision(key);
    netOverlayOff();
    return v;
  }
}

// online: そのpiが自分の操作担当か(表示切替用)。offline: isHuman
function isLocalTurn(pi){ return netOnline()? (pi===NET.seat) : !!(G.players[pi]&&G.players[pi].isHuman); }
// 移動記述子を適用(local/remote/CPU共通)。localTurn=自分の番か。返り値'pass'なら以降の移動を打ち切る
async function applyMoveDescriptor(pi, mv, localTurn){
  const p=G.players[pi];
  if(!mv){ if(!localTurn) await enemyNotice(p,`ここは<b>動かず待機</b>(パス)`,1200); return 'pass'; }
  if(!localTurn){
    let msg;
    if(mv.declare){ msg=`🎉 「${p.active.card.name}」が目的地 <b>${p.active.destLabel}</b> に到着!`; }
    else{ const dst=landmarkDesc(G.board,mv.move.cell); const rem=walkDistUI(mv.move.cell,p.active.dest);
      msg=`「${p.active.card.name}」が${modeName(mv.move.mode)}で <b>${dst}</b> へ`+(rem>0?` (目的地まであと約${rem}マス)`:''); }
    await enemyNotice(p,msg);
  }
  if(mv.declare){ const dc=p.active.dest, tr0=p.active.card.trait; declareArrive(G,pi); ACH_GAME.traits.push(tr0); onArrive(p,dc); }
  else{
    const trBefore=p.active?p.active.card.trait:'';
    if(mv.move.mode==='ride')ACH_GAME.ride=true;
    if(mv.move.mode==='warp')ACH_GAME.warp=true;
    try{ await animateMove(mv.move,pi); }catch(e){}
    ANIM=null;
    let evs=[]; try{ evs=applyMove(G,pi,mv.move,mv.payment); }catch(e){}
    if(evs.some(e=>e.type==='arrive')){ ACH_GAME.traits.push(trBefore); onArrive(p,mv.move.cell); }
    if(localTurn && p.active){
      if(G.board.stations.includes(p.active.cell))
        await hintOnce('stawait','🚉 駅に到着!','ここで1ターン待つ(=次の移動フェイズで動かない or 今ターンはこれで終了)と、次のターンに🚃電車に乗れます。<br>駒の下の「⏳待機中…」が「乗れる!」に変わったら出発OK。');
      else if(G.board.busStopCells.includes(p.active.cell))
        await hintOnce('buswait','🚏 バス停に到着!','ここで1ターン待つと、次のターンに🚌バスで2駅先まで一気に移動できます。<br>駒の下の「⏳待機中…」が「乗れる!」に変わったら出発OK。');
    }
  }
  return 'moved';
}
// ターン境界の同期照合(online, 不一致時のみ警告)
function netTurnSync(){
  if(!netOnline()) return;
  const rep=syncReport(), turn=G.turn;
  NET._turnMine={turn, rep};
  netSendRaw({t:'tsync', turn, rep});
  const pend=NET._turnPending;
  if(pend && pend.turn===turn){ netTurnCompare(rep, pend.rep); NET._turnPending=null; }
}
function netTurnCompare(mine, other){
  const parts=['rng','house','dest','hand','deck'];
  const diffs=parts.filter(k=>mine[k]!==other[k]);
  if(diffs.length) netOverlay(`❌ ターン同期ズレ: <b style="color:#ff6b6b">${diffs.join(' / ')}</b><br><span class="sm">この単語を開発者に伝えてください</span>`);
}
// ---- 準備フェーズ用: 決定データを取得(online=local UI→送信 / remote=受信, offline=human/ai) ----
async function decideData(pi, tag, humanFn, aiFn){
  if(netOnline()){
    const key=netDecideKey(tag,pi);
    if(pi===NET.seat){ const v=await humanFn(); netSendDecision(key,v); return v; }
    netOverlay('⌛ 相手の準備を待っています…');
    const v=await netRecvDecision(key); netOverlayOff(); return v;
  }
  return G.players[pi].isHuman ? await humanFn() : aiFn();
}
// 家3軒を選ぶUI(online時はおまかせ無し=手動のみ:乱数を消費しないため) → [cell,cell,cell]
async function uiPickHomes(pi, taken){
  const p=G.players[pi];
  if(netOnline()) netOverlay('🏠 あなたの番: 自分の家を3軒えらびます');
  const mode=await panelChoose('自分の家を3軒選びます',[
    {label:'自分で選ぶ',sub:'盤面から3軒タップ',value:'manual'},
    {label:'おまかせ',sub:'自動でえらぶ',value:'auto'}]);
  if(mode==='auto') return netOnline()? autoPickHomes(pi,taken) : aiSetup(G,pi,taken).houses;
  const houses=[];
  for(let k=0;k<3;k++){
    const free=G.board.houses.filter(h=>!taken.has(h)&&!houses.includes(h));
    houses.push(await pickCell(free,`家を選ぶ (${k+1}/3)`));
    p.houses=[...houses]; draw();
  }
  return houses;
}
// (pi+1)の目的地を指名するUI → dests[]
async function uiPickDests(pi, taken){
  const nxt=G.players[(pi+1)%G.players.length];
  if(netOnline()) netOverlay(`🎯 あなたの番: 相手(${nxt.name})の目的地を${destCount(G)}つ指名(意地悪に！)`);
  const mode=await panelChoose(`${nxt.name}の目的地を${destCount(G)}つ指名します(意地悪に選ぼう)`,[
    {label:'自分で選ぶ',sub:'盤面からタップ(駅・特殊施設・バス停・空き家)',value:'manual'},
    {label:'おまかせ',value:'auto'}]);
  if(mode==='auto') return netOnline()? autoPickDests(pi,taken) : aiSetup(G,pi,taken).dests;
  const dests=[];
  for(let k=0;k<destCount(G);k++){
    const cands=destCandidates(G).filter(d=>!taken.has(d.cell)&&!dests.some(x=>x.cell===d.cell));
    const labels=new Map(cands.map(d=>[d.cell,d.label.replace(/\(.*\)/,'')]));
    const c=await pickCell(cands.map(d=>d.cell),`${nxt.name}の目的地 ${k+1}/${destCount(G)}`,false,labels);
    dests.push(cands.find(d=>d.cell===c));
  }
  return dests;
}
// ドラフト: piのパックから1枚選ぶUI → cardId
async function uiDraftPick(pi, r){
  const pack=G.draftPacks[pi];
  return await new Promise(res=>{
    $('panel').innerHTML=`<div class="ptitle">ドラフト ${r+1}/7 — 1枚選ぶ</div>${mySetupSummary()}<div class="cards" id="dcards"></div>`;
    const dc=$('dcards');
    for(const c of pack){
      const d=document.createElement('div');
      d.innerHTML=charCardHTML(c);
      d.firstChild.onclick=()=>res(c.id);
      dc.appendChild(d.firstChild);
    }
  });
}
