<style>
:root{--bg:#10141c;--panel:#1c2331;--card:#242e42;--acc:#4fc3f7;--txt:#e8ecf4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;overscroll-behavior:none;}
.screen{display:none;min-height:100vh;}
.screen.on{display:block;}
#screen-title{text-align:center;padding:24px 16px;background:linear-gradient(180deg,#0d1220 0%,#16233c 60%,#0d1220 100%);}
#screen-title h1{font-size:34px;margin:12px 0 2px;letter-spacing:2px;
 background:linear-gradient(90deg,#ffd54f,#4fc3f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
#screen-title .sub{color:#9fb2cc;font-size:13px;margin-bottom:14px;}
#heroimg{width:150px;border-radius:12px;box-shadow:0 4px 30px rgba(79,195,247,.35);}
.opt{margin:10px 0;}
.opt .olabel{font-size:11px;color:#9fb2cc;margin-bottom:5px;}
.opt label{display:inline-block;margin:0 4px;padding:8px 14px;background:var(--card);border-radius:10px;border:2px solid transparent;font-size:14px;}
.opt input{display:none;}
.opt input:checked+span{color:var(--acc);font-weight:bold;}
.opt label:has(input:checked){border-color:var(--acc);}
.bigbtn{display:inline-block;padding:14px 46px;font-size:19px;font-weight:bold;color:#08111f;
 background:linear-gradient(90deg,#ffd54f,#4fc3f7);border:none;border-radius:30px;margin-top:10px;}
.note{max-width:480px;margin:16px auto 0;text-align:left;font-size:12px;color:#8fa3bd;line-height:1.7;
 background:rgba(255,255,255,.04);padding:12px 16px;border-radius:12px;}
#screen-game{display:none;padding:4px;}
#screen-game.on{display:flex;flex-direction:column;align-items:center;}
#topbar{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;}
#status{flex:1;font-size:12px;color:#ffd54f;min-height:18px;padding:2px 6px;text-align:center;}
#zoombtn{background:var(--card);color:var(--txt);border:1px solid #3a4b6b;border-radius:8px;font-size:11px;padding:4px 8px;}
#players{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:2px;}
.pchip{border:1.5px solid;border-radius:8px;padding:3px 8px;font-size:11px;background:var(--panel);display:flex;gap:6px;align-items:center;}
.pchip .sm{color:#9fb2cc;}
.pchip .dots{color:#ffd54f;letter-spacing:1px;}
.cstack{display:inline-flex;align-items:center;gap:3px;}
.cstack b{font-size:10px;color:#c5d2e6;}
.cback{display:inline-block;width:9px;height:13px;border-radius:2px;border:1px solid rgba(255,255,255,.5);}
.cback.char{background:linear-gradient(135deg,#2fa14d,#1c5e30);}
.cback.act{background:linear-gradient(135deg,#e0a92f,#8a5f10);}
#boardwrap{max-width:100%;overflow:hidden;border-radius:8px;touch-action:none;}
#board{background:#e8f0e0;border-radius:8px;touch-action:manipulation;display:block;}
#handbar{display:flex;gap:5px;overflow-x:auto;width:100%;max-width:560px;padding:5px 2px;background:#141a26;border-radius:8px;margin-top:5px;min-height:52px;align-items:center;}
.mini{flex-shrink:0;width:86px;border-radius:7px;padding:4px 6px;font-size:10px;border:1.5px solid;position:relative;background:var(--card);}
.mini .mhead{font-weight:bold;font-size:10px;line-height:1.25;}
.mini .mbody{color:#9fb2cc;font-size:9px;}
.mini.char{border-color:#2fa14d;background:linear-gradient(160deg,#1d3325,#16281d);}
.mini.act.km{border-color:#4fc3f7;background:linear-gradient(160deg,#16334a,#122438);}
.mini.act.kb{border-color:#ffb74d;background:linear-gradient(160deg,#4a3416,#2f2410);}
.mini.act.ks{border-color:#ce93d8;background:linear-gradient(160deg,#3a2145,#241429);}
.mini .mpts{position:absolute;top:2px;right:4px;background:#ffd54f;color:#08111f;border-radius:6px;
 font-size:9px;font-weight:bold;padding:0 4px;}
#panel{width:100%;max-width:560px;background:var(--panel);border-radius:12px;padding:10px;margin-top:6px;min-height:110px;}
.ptitle{font-weight:bold;font-size:14px;margin-bottom:8px;color:#ffd54f;}
.plist{display:flex;flex-direction:column;gap:6px;max-height:32vh;overflow-y:auto;}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);color:var(--txt);
 border:1px solid #3a4b6b;border-radius:10px;padding:9px 12px;font-size:14px;text-align:left;}
.pbtn:active{background:#31405e;}
.pbtn.primary{border-color:var(--acc);background:#1c3a52;}
.pbtn.warn{border-color:#a15;}
.pbtn .sm{font-size:11px;color:#9fb2cc;}
.sm{font-size:11px;color:#9fb2cc;line-height:1.6;}
.cards{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
/* カード(大) */
.ccard{min-width:158px;max-width:180px;border-radius:12px;padding:0 0 9px;flex-shrink:0;overflow:hidden;
 border:2px solid #3a4b6b;background:linear-gradient(170deg,#2b3650,#1b2334);box-shadow:0 3px 10px rgba(0,0,0,.45);}
.ccard .chead{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;font-weight:bold;font-size:13px;
 background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.03));}
.ccard .cage{font-size:10px;color:#9fb2cc;padding:2px 9px;}
.ccard .ctrait{color:#7fe0a0;font-size:12.5px;font-weight:bold;padding:3px 9px;}
.ccard .cdesc{font-size:11px;color:#b8c6dc;line-height:1.55;padding:2px 9px;}
.ccard.char{border-color:#2fa14d;background:linear-gradient(170deg,#20402c,#14231a);}
.ccard.act.km{border-color:#4fc3f7;background:linear-gradient(170deg,#1b3d59,#122438);}
.ccard.act.kb{border-color:#ffb74d;background:linear-gradient(170deg,#54401e,#2f2410);}
.ccard.act.ks{border-color:#ce93d8;background:linear-gradient(170deg,#43264f,#241429);}
.pbadge{background:#ffd54f;color:#08111f;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:bold;}
.kbadge{border-radius:8px;padding:1px 7px;font-size:10px;font-weight:bold;color:#08111f;}
.kbadge.km{background:#4fc3f7;}.kbadge.kb{background:#ffb74d;}.kbadge.ks{background:#ce93d8;}
#log{width:100%;max-width:560px;height:64px;overflow-y:auto;font-size:10.5px;color:#8fa3bd;
 background:#141a26;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.55;}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:center;justify-content:center;padding:20px;}
#modal.on{display:flex;}
#modalbox{background:var(--panel);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
#modalbtns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.mbtn{padding:10px 18px;border-radius:10px;border:1px solid #3a4b6b;background:var(--card);color:var(--txt);font-size:14px;}
.mbtn.primary{background:#1c3a52;border-color:var(--acc);font-weight:bold;}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-80px);background:#ffd54f;color:#08111f;
 font-weight:bold;padding:10px 22px;border-radius:24px;transition:transform .42s cubic-bezier(.3,1.35,.4,1);z-index:99;font-size:14px;max-width:90vw;}
#toast.on{transform:translateX(-50%) translateY(0);}
.rrow{padding:6px 0;border-bottom:1px solid #2a3854;font-size:15px;}
.subbtn{background:var(--card);color:var(--txt);border:1px solid #3a4b6b;border-radius:20px;padding:9px 18px;font-size:13px;}
.modes{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap;}
.modebtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:118px;padding:12px 6px;
 background:var(--card);color:var(--txt);border:2px solid #3a4b6b;border-radius:14px;font-size:15px;}
.modebtn .mico{font-size:26px;}
.modebtn .msub{font-size:9.5px;color:#9fb2cc;line-height:1.3;}
.modebtn.sel{border-color:#ffd54f;background:#33384f;box-shadow:0 0 12px rgba(255,213,79,.4);}
.modebtn.locked{opacity:.45;}
.chk{font-size:12px;color:#9fb2cc;margin-left:10px;}
.pchip.me{box-shadow:0 0 8px rgba(255,213,79,.7);background:#2a3049;}

/* ===== v5 ===== */
.pbtn,.mbtn,.subbtn,.bigbtn,.modebtn,.mini,#zoombtn,#sndbtn,#helpbtn{transition:transform .12s ease,box-shadow .15s ease,background .15s ease;}
.pbtn:active,.mbtn:active,.subbtn:active,.modebtn:active,.mini:active{transform:scale(.96);}
.bigbtn:active{transform:scale(.95);}
.bigbtn{box-shadow:0 4px 18px rgba(79,195,247,.35);position:relative;overflow:hidden;}
.bigbtn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;transform:skewX(-20deg);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.8s infinite;}
@keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
#screen-title h1{background-size:200% auto;animation:huedrift 5s linear infinite alternate;}
@keyframes huedrift{from{background-position:0% center}to{background-position:100% center}}
#modalbox{animation:modalin .22s cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes modalin{from{transform:scale(.82) translateY(14px);opacity:0}to{transform:none;opacity:1}}
#panel>*{animation:fadeup .28s ease both;}
.plist .pbtn{animation:fadeup .3s ease both;}
.plist .pbtn:nth-child(2){animation-delay:.05s}.plist .pbtn:nth-child(3){animation-delay:.1s}
.plist .pbtn:nth-child(4){animation-delay:.15s}.plist .pbtn:nth-child(5){animation-delay:.2s}
.plist .pbtn:nth-child(6){animation-delay:.25s}
.mini{animation:fadeup .3s ease both;}
@keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.screen.on{animation:screenin .35s ease both;}
@keyframes screenin{from{opacity:0}to{opacity:1}}
#phasebn{position:fixed;left:0;right:0;top:33%;z-index:70;display:none;pointer-events:none;text-align:center;}
#phasebn.on{display:block;animation:pbn .85s ease both;}
#phasebn .inner{display:inline-block;padding:11px 46px;font-size:20px;font-weight:bold;color:#fff;letter-spacing:3px;
 background:linear-gradient(90deg,rgba(13,18,32,0),rgba(13,18,32,.93) 22%,rgba(13,18,32,.93) 78%,rgba(13,18,32,0));
 text-shadow:0 2px 8px #000;}
@keyframes pbn{0%{opacity:0;transform:translateX(46px)}18%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-46px)}}
.cfp{position:fixed;width:8px;height:12px;z-index:75;pointer-events:none;border-radius:2px;}
#helpbtn{background:var(--card);color:var(--txt);border:1px solid #3a4b6b;border-radius:8px;font-size:11px;padding:4px 8px;}
.tgrow{font-size:30px;display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0;}
.tgrow .arr{color:#4fc3f7;font-size:22px;}
.lg{padding:4px 0;border-bottom:1px dashed #2a3854;font-size:12.5px;line-height:1.7;color:#b8c6dc;}
.timrow{display:flex;gap:6px;justify-content:center;margin:8px 0;}
.timrow img{width:56px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.4);}
#handbar{flex-wrap:wrap;overflow:visible;justify-content:center;}
.mini{width:56px;height:84px;padding:2px 2px 3px;text-align:center;display:flex;flex-direction:column;overflow:hidden;}
.mini .mimg{width:100%;height:46px;flex-shrink:0;object-fit:cover;border-radius:5px;display:block;background:#0e1420;}
.mini .mhead{font-size:8.5px;line-height:1.15;margin-top:2px;max-height:20px;overflow:hidden;}
.mini .mbody{font-size:7.5px;}
.ccard .cimg{width:100%;height:118px;object-fit:cover;display:block;background:#0e1420;}
#cardfx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;pointer-events:none;background:rgba(0,0,0,.25);}
#cardfx.on{display:flex;}
.cfxwrap{text-align:center;}
.cfxname{font-size:15px;font-weight:bold;margin-bottom:8px;text-shadow:0 1px 6px #000;}
.cfxcard{width:200px;margin:0 auto;animation:cfxin 1s cubic-bezier(.2,.8,.3,1) forwards;filter:drop-shadow(0 0 26px rgba(255,213,79,.8));}
.cfxcard .ccard{min-width:0;max-width:none;width:200px;margin:0 auto;}
@keyframes cfxin{0%{transform:scale(.25) rotate(-14deg);opacity:0}
 30%{transform:scale(1.12) rotate(2deg);opacity:1}
 55%{transform:scale(1) rotate(0);}
 80%{transform:scale(1);opacity:1}
 100%{transform:scale(1.45);opacity:0}}
#sndbtn{background:var(--card);color:var(--txt);border:1px solid #3a4b6b;border-radius:8px;font-size:11px;padding:4px 8px;}
.pchip .score{color:#7fe0a0;font-weight:bold;}
.pchip{transition:box-shadow .25s,transform .25s;}
.pchip.turn{box-shadow:0 0 10px 2px rgba(255,213,79,.85);transform:scale(1.06);}
#effects{width:100%;max-width:560px;text-align:center;line-height:1.5;}
.fxchip{display:inline-block;background:#2a2436;border:1px solid #6b4b8a;color:#d8c6ec;border-radius:12px;font-size:9.5px;padding:2px 8px;margin:1px 2px;}
#autobox{position:fixed;top:10%;left:50%;z-index:60;opacity:0;pointer-events:none;
 width:min(400px,92vw);background:linear-gradient(170deg,#222b40,#181f2e);border:1px solid #3a4b6b;border-radius:14px;
 padding:13px 15px 10px;box-shadow:0 10px 34px rgba(0,0,0,.6),0 0 24px rgba(79,195,247,.12);
 transform:translateX(-50%);}
#autobox::before{content:'';position:absolute;top:0;left:14px;right:14px;height:2.5px;border-radius:2px;
 background:linear-gradient(90deg,#ffd54f,#4fc3f7);}
#autobox.on{animation:abIn .42s cubic-bezier(.18,1.1,.3,1.18) both;opacity:1;pointer-events:auto;}
#autobox.out{animation:abOut .3s cubic-bezier(.55,0,.8,.4) both;pointer-events:none;}
@keyframes abIn{0%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.9)}
 60%{opacity:1}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes abOut{from{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
 to{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.94)}}
#autobox .ptitle{animation:fadeup .32s .07s ease both;margin-bottom:4px;}
#autobox .sm{animation:fadeup .32s .15s ease both;}
#modalbox .ccard{width:240px;max-width:100%;margin:0 auto;}

/* ===== v7 レイアウト: キャラ手札を横に置き1画面化 ===== */
#playrow{display:flex;gap:4px;width:100%;max-width:560px;justify-content:center;align-items:flex-start;}
#boardwrap{min-width:0;}
#log{display:none;}
#sidehand{width:58px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;max-height:52vh;overflow-y:auto;padding-bottom:2px;}
#sidehand .sidelbl{font-size:9px;color:#9fb2cc;text-align:center;line-height:1.15;margin-bottom:1px;position:sticky;top:0;background:#10141c;padding:1px 0;}
#sidehand .mini{width:100%;height:72px;margin:0;}
#sidehand .mini .mimg{height:36px;}
#handbar{min-height:44px;padding:4px 2px;}
#handbar .mini{touch-action:none;}
#sidehand .mini{touch-action:pan-y;}
.handhint{width:100%;text-align:center;font-size:11px;color:#ffd54f;font-weight:bold;margin-bottom:2px;}
.mini.usable{box-shadow:0 0 0 2px #ffd54f,0 0 10px rgba(255,213,79,.5);}
#log{height:34px;margin-top:4px;}
#panel{min-height:80px;margin-top:5px;}
/* 順位バッジ(上部プレイヤー表示) */
.pchip{position:relative;}
.pchip .rk{display:inline-block;font-weight:bold;font-size:11px;color:#08111f;border-radius:6px;padding:0 5px;margin-right:1px;}
.pchip .rk.r1{background:#ffd54f;}.pchip .rk.r2{background:#cfd8e3;}.pchip .rk.r3{background:#e0a56b;}.pchip .rk.r4{background:#9fb2cc;}
.pchip .goalbar{display:inline-block;width:38px;height:6px;border-radius:3px;background:#2a3854;overflow:hidden;vertical-align:middle;margin-left:2px;}
.pchip .goalbar>i{display:block;height:100%;background:linear-gradient(90deg,#7fe0a0,#ffd54f);}

/* ===== v7.1 追加イラスト組み込み ===== */
.rkbadge{position:relative;display:inline-block;width:22px;height:22px;vertical-align:middle;margin-right:1px;flex:0 0 auto;}
.rkbadge img{width:22px;height:22px;display:block;}
.rkbadge b{position:absolute;left:0;top:0;width:22px;height:15px;line-height:15px;text-align:center;font-size:10px;color:#4a3200;text-shadow:0 1px 0 rgba(255,255,255,.55);}
.tkt{width:22px;height:22px;vertical-align:middle;margin-right:5px;}
.mini{touch-action:none;transition:transform .13s ease, box-shadow .15s ease;will-change:transform;}
.mini.lift{transform:translateY(-14px) scale(1.07);box-shadow:0 9px 20px rgba(0,0,0,.55);z-index:6;position:relative;}
.mini.pass{border-color:#ce93d8;background:linear-gradient(160deg,#3a2145,#241429);}
.mini.pass .mimg{object-fit:contain;background:#241429;}
#peek{position:fixed;inset:0;z-index:88;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none;}
#peek.on{display:flex;flex-direction:column;}
#peek .ccard{width:262px;max-width:86vw;animation:pkin .16s ease both;}
@keyframes pkin{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#peek .pkhint{color:#ffd54f;font-size:12.5px;margin-top:10px;font-weight:bold;text-shadow:0 1px 4px #000;}

/* ===== v7.4 横画面の自動対応(盤面=左, 操作=右) ===== */
@media (orientation:landscape) and (max-height:540px){
  #screen-game.on{display:grid;grid-template-columns:min-content 1fr;grid-template-rows:auto auto auto 1fr;
    gap:5px;height:100vh;align-items:start;padding:4px;box-sizing:border-box;overflow:hidden;}
  #playrow{grid-column:1;grid-row:1 / span 4;align-self:center;}
  #topbar{grid-column:2;grid-row:1;max-width:none;}
  #players{grid-column:2;grid-row:2;}
  #effects{display:none;}
  #handbar{grid-column:2;grid-row:3;max-width:none;flex-wrap:wrap;overflow:visible;}
  #panel{grid-column:2;grid-row:4;max-width:none;margin:0;overflow-y:auto;min-height:0;}
  #boardwrap{max-height:94vh;}
  #sidehand{max-height:94vh;}
}
#dbg{position:fixed;left:2px;bottom:2px;z-index:200;font-size:9px;line-height:1.3;color:#9fe6b0;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:5px;max-width:97vw;pointer-events:none;font-family:monospace;white-space:nowrap;overflow:hidden;}
</style>
</head>

// --- 線路カード: 駅index 0=北西 1=北東 2=中央 3=南西 4=南東 ---
const RAIL_PATTERNS = (() => {
  const paths = {
    M: [[3,0,2,1,4],[0,1,2,4,3],[1,4,2,3,0],[4,3,2,0,1]],
    N: [[3,0,2,4,1],[0,1,2,3,4],[1,4,2,0,3],[4,3,2,1,0]],
  };
  const G = [
    [[0,1],[1,4],[4,3],[3,2]],
    [[1,4],[4,3],[3,0],[0,2]],
    [[4,3],[3,0],[0,1],[1,2]],
    [[3,0],[0,1],[1,4],[4,2]],
  ];
  const cards = [];
  for (let i=0;i<4;i++) cards.push({type:'X', name:'Ｘ型', edges:[[2,0],[2,1],[2,3],[2,4]]});
  const pathEdges = p => p.slice(1).map((s,i)=>[p[i],s]);
  for (const t of ['M','N']) for (let r=0;r<4;r++) for (let k=0;k<2;k++)
    cards.push({type:t, name:t+'型'+(r+1), edges:pathEdges(paths[t][r])});
  for (let r=0;r<4;r++) for (let k=0;k<2;k++)
    cards.push({type:'G', name:'Ｇ型'+(r+1), edges:G[r]});
  return cards; // 28枚
})();

// キャラデッキ生成(人数×5枚以上)
function buildCharDeck(rng, allowTraits) {
  let keys = Object.keys(TRAITS);
  if (allowTraits) keys = keys.filter(k=>allowTraits.includes(k));
  const deck = [];
  let id = 0;
  // 全特徴1枚 + 1点特徴をもう1枚ずつ→26枚
  const list = [...keys, ...keys.filter(k=>TRAITS[k].pts<=4)]; // 20 + 15 = 35枚(7枚ドラフト×4人に対応)
  const nm = [...CHAR_NAMES_M], nf = [...CHAR_NAMES_F];
  for (const k of list) {
    const male = rng() < 0.5;
    const pool = male ? nm : nf;
    const name = pool.length ? pool.splice(Math.floor(rng()*pool.length),1)[0] : 'ななし';
    let age = 5 + Math.floor(rng()*81);
    if (k==='ronin') age = 18 + Math.floor(rng()*5);
    if (k==='byonin' && age < 30) age += 30;
    deck.push({ id:'c'+(id++), name, gender: male?'M':'F', age, trait:k,
                pts: TRAITS[k].pts, tname: TRAITS[k].name, desc: TRAITS[k].desc });
  }
  return deck;
}

function gameToJSON(G){
  return JSON.stringify(G,(k,v)=>{
    if(k==='_fieldCache'||k==='_adjCache')return undefined;
    if(v instanceof Set)return {__set:[...v]};
    if(typeof v==='function')return (v.s!==undefined)?{__rng:v.s}:undefined;
    return v;
  });
}
function gameFromJSON(str){
  return JSON.parse(str,(k,v)=>{
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      if(Object.prototype.hasOwnProperty.call(v,'__set'))return new Set(v.__set);
      if(Object.prototype.hasOwnProperty.call(v,'__rng'))return mulberry32(v.__rng);
    }
    return v;
  });
}
// 素の徒歩BFS距離(キャッシュ非依存。道路変更の評価などに使う)
function bfsWalkDist(B,from,to){
  if(from===to)return 0;
  let q=[from];const seen=new Set(q);let d=0;
  while(q.length&&d<400){d++;const nq=[];
    for(const c of q)for(const n of roadNeighbors(B,c)){
      if(seen.has(n.cell))continue;
      if(n.cell===to)return d;
      seen.add(n.cell);nq.push(n.cell);}
    q=nq;}
  return -1;
}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const CK=(x,y)=>x+','+y;
const DIRS={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};
const OPP={N:'S',S:'N',E:'W',W:'E'};

// ---- 盤面 ----
function buildBoard(mapData){
  const B={W:mapData.W,H:mapData.H,edges:new Set(),cells:{}};
  for(const [a,b] of mapData.edges) B.edges.add(edgeKey(a[0],a[1],b[0],b[1]));
  B.stations=mapData.stations.map(c=>CK(c[0],c[1]));
  B.facilities={}; for(const k in mapData.facilities){const c=mapData.facilities[k];B.facilities[k]=CK(c[0],c[1]);}
  B.busLoop=mapData.busLoop.map(c=>CK(c[0],c[1]));
  // 停留所: ループ上の位置index → セル。セル重複は最初のみ採用
  B.busStopPos=[]; const seen=new Set();
  for(const i of mapData.busStops){const c=B.busLoop[i]; if(!seen.has(c)){seen.add(c);B.busStopPos.push(i);}}
  B.busStopCells=B.busStopPos.map(i=>B.busLoop[i]);
  B.houses=mapData.houses.map(c=>CK(c[0],c[1]));
  B.desert=new Set(mapData.desert.map(c=>CK(c[0],c[1])));
  // バス路線が使う辺(道路変更で保護)
  B.busEdges=new Set();
  for(let i=0;i<B.busLoop.length;i++){
    const [x1,y1]=B.busLoop[i].split(',').map(Number);
    const [x2,y2]=B.busLoop[(i+1)%B.busLoop.length].split(',').map(Number);
    if(Math.abs(x1-x2)+Math.abs(y1-y2)===1) B.busEdges.add(edgeKey(x1,y1,x2,y2));
  }
  return B;
}
function edgeKey(x1,y1,x2,y2){const a=CK(x1,y1),b=CK(x2,y2);return a<b?a+'|'+b:b+'|'+a;}
function neighbors(B,cell){
  const [x,y]=cell.split(',').map(Number); const out=[];
  for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
    if(nx>=0&&nx<B.W&&ny>=0&&ny<B.H) out.push({cell:CK(nx,ny),dir:d});}
  return out;
}
function roadNeighbors(B,cell){return neighbors(B,cell).filter(n=>B.edges.has(edgeKey(...cell.split(',').map(Number),...n.cell.split(',').map(Number))));}
function cellDirs(B,cell){return roadNeighbors(B,cell).map(n=>n.dir);}
function facilityAt(B,cell){
  if(B.stations.includes(cell)) return {type:'station',idx:B.stations.indexOf(cell)};
  for(const k in B.facilities) if(B.facilities[k]===cell) return {type:'special',key:k};
  if(B.busStopCells.includes(cell)) return {type:'busstop'};
  if(B.houses.includes(cell)) return {type:'house'};
  return null;
}

// ---- ゲーム生成 ----
function newGame(opts){
  const rng=mulberry32(opts.seed||Math.floor(Math.random()*1e9));
  const G={
    rng, board:buildBoard(opts.mapData),
    players:opts.players.map((p,i)=>({
      i, name:p.name||PLAYER_NAMES[i], isHuman:!!p.isHuman, color:PLAYER_COLORS[i],
      charHand:[], actionHand:[], houses:[], dests:[],
      usedHouses:[], usedDests:[], usedChars:[],
      journeys:0, usedPts:0, reachAnnounced:false, active:null, needsPlacement:true,
      fx:{}, // 個別効果
    })),
    charDeck:shuffle(buildCharDeck(rng,opts.allowTraits),rng),
    actionDeck:shuffle(buildActionDeck(rng,opts.allowActions),rng),
    noActions:!!opts.noActions, destPool:opts.destPool||'all', aiNoise:opts.aiNoise||0, drawLuck:opts.drawLuck||0,
    goalPts:opts.goalPts||18,
    actionDiscard:[], charDiscard:[],
    railDeck:shuffle([...RAIL_PATTERNS],rng),
    rail:null,
    turn:1, startPlayer:0, phase:'setup',
    fx:{}, // 全体効果 {mattaTurn, drawkinTurn, jutaiTurn, unkyuUntil, kojiCell, kojiTurn}
    firstArrivalDone:false, log:[], winner:null, ranking:[],
  };
  G.rail=G.railDeck[Math.floor(G.rng()*G.railDeck.length)];
  G.startPlayer=Math.floor(G.rng()*G.players.length);
  return G;
}
function log(G,msg){G.log.push(msg); if(G.log.length>400)G.log.shift();}
// 目的地(=旅の回数)は得点目標から算出。3点キャラだけでも18点に届く回数を確保
function destCount(G){return Math.min(7, Math.ceil((G.goalPts||18)/3)+1);}
const NUMSYM='①②③④⑤⑥⑦⑧⑨';

// ---- セットアップ: 家3軒と目的地3つ ----
function destCandidates(G){
  const B=G.board, out=[];
  B.stations.forEach((c,i)=>out.push({cell:c,label:STATION_NAMES[i],type:'station'}));
  for(const k in B.facilities) out.push({cell:B.facilities[k],label:FAC_INFO[k].name,type:'special'});
  if(G.destPool==='hub') return out;
  for(const c of B.busStopCells){
    if(B.stations.includes(c))continue;
    let sp=false; for(const k in B.facilities)if(B.facilities[k]===c)sp=true;
    if(sp)continue;
    out.push({cell:c,label:'バス停('+landmarkDesc(B,c)+')',type:'busstop'});
  }
  for(const c of B.houses){
    if(G.players.some(p=>p.houses.includes(c)))continue;
    out.push({cell:c,label:'家('+landmarkDesc(B,c)+')',type:'house'});
  }
  return out;
}
function autoAssignSetup(G,pi,houseCells,destPicks){
  const p=G.players[pi];
  p.houses=houseCells; // 3 cells
  // destPicks は「次のプレイヤーの目的地」として登録
  const nxt=G.players[(pi+1)%G.players.length];
  nxt.dests=destPicks; // [{cell,label}]
}

// ---- ドラフト ----
function makeDraftPacks(G){
  const n=G.players.length;
  G.draftPacks=[]; G.draftRound=0;
  for(let i=0;i<n;i++) G.draftPacks.push(G.charDeck.splice(0,7));
}
function draftPickAll(G,picks){ // picks[pi]=cardId
  const n=G.players.length;
  for(let pi=0;pi<n;pi++){
    const pack=G.draftPacks[pi];
    const idx=pack.findIndex(c=>c.id===picks[pi]);
    G.players[pi].charHand.push(pack.splice(idx,1)[0]);
  }
  // 左隣へ回す
  G.draftPacks.unshift(G.draftPacks.pop());
  G.draftRound++;
  return G.draftRound>=7;
}
function dealActions(G){for(const p of G.players) for(let i=0;i<5;i++){const c=drawAction(G,p);if(c)p.actionHand.push(c);}}
function drawAction(G,p){
  if(G.actionDeck.length===0){
    if(G.actionDiscard.length===0) return null;
    G.actionDeck=shuffle(G.actionDiscard,G.rng); G.actionDiscard=[];
  }
  // 難易度アシスト: 人間には「今ちょうど良いカード」が出やすい
  if(p&&p.isHuman&&G.drawLuck&&G.rng()<G.drawLuck&&G.actionDeck.length>1){
    const k=Math.min(3,G.actionDeck.length);
    let bi=0,bs=-1;
    for(let i=0;i<k;i++){
      const sc=cardFitScore(G,p,G.actionDeck[G.actionDeck.length-1-i])+G.rng()*0.8;
      if(sc>bs){bs=sc;bi=i;}
    }
    return G.actionDeck.splice(G.actionDeck.length-1-bi,1)[0];
  }
  return G.actionDeck.pop();
}
function cardFitScore(G,p,c){
  const useful={idaten:3,nikai:3,rsm_card:3,ontime:2.5,nukemichi:2,heli:2,cancel:2,
    otsukare:1.5,jutai:1.5,unkyu:1.5,assemble:1,koji:1,matta:1};
  let sc=useful[c.key]||0.5;
  const rivalBest=Math.max(0,...G.players.filter(q=>q.i!==p.i).map(q=>q.journeys));
  if(p.journeys<rivalBest)sc*=1.6; // 負けているときほど強いカードが来る
  return sc;
}
function gainActions(G,p,n){
  if(G.noActions)return;
  if(G.fx.drawkinTurn===G.turn){log(G,`${p.name}: ドロー禁止で引けない`);return;}
  for(let i=0;i<n;i++){const c=drawAction(G,p); if(c)p.actionHand.push(c);}
}

// ---- 配置(準備フェイズ) ----
function neededReserve(G,p){ // 残り必要キャラ数(これ未満に手札を減らせない)
  if(!G.noActions) return 0; // 乗り物コストはアクションカードなのでキャラ温存不要
  const need=Math.ceil(((G.goalPts||18)-p.usedPts)/5);
  return Math.max(0, need-(p.active?1:0));
}
function placeCharacter(G,pi,charId,houseCell,destIdx){
  const p=G.players[pi];
  const ci=p.charHand.findIndex(c=>c.id===charId);
  const card=p.charHand.splice(ci,1)[0];
  const dest=p.dests[destIdx];
  p.usedDests.push(destIdx); p.usedChars.push(card); // 家は消費しない(何度でも出発可)
  p.active={card, cell:houseCell, home:houseCell, dest:dest.cell, destLabel:dest.label,
    cellSince:G.turn-1, usedVehicle:false, lastMode:null, leftVehicleTurn:-9,
    yureiUsed:false, mustVisit:new Set(), placedTurn:G.turn, path:[houseCell]};
  const t=card.trait;
  if(t==='byonin') p.active.mustVisit.add('pass:hospital');
  if(t==='ronin') p.active.mustVisit.add('pass:library');
  p.needsPlacement=false;
  log(G,`${p.name}が「${card.name}」(${card.tname})を配置 → 目的地:${dest.label}`);
}

// ---- アクションフェイズ ----
// 全員の選択 choices[pi] = {cardId or null}
// 解決順: cancel/matta/drawkin を最初(手番順)、その後手番順
function resolveOrder(G,choices){
  const n=G.players.length, order=[];
  for(let k=0;k<n;k++) order.push((G.startPlayer+k)%n);
  const first=[],rest=[];
  for(const pi of order){
    const ch=choices[pi]; if(!ch||!ch.cardId) continue;
    const card=G.players[pi].actionHand.find(c=>c.id===ch.cardId);
    if(!card) continue;
    (['cancel','matta','drawkin'].includes(card.key)?first:rest).push({pi,card});
  }
  return [...first,...rest];
}
// 1枚実行。target はカードにより {cell}|{charPi}|{cancelCardId}|{dirs}|null
function applyAction(G,pi,card,target){
  const p=G.players[pi];
  const hi=p.actionHand.findIndex(c=>c.id===card.id);
  if(hi>=0)p.actionHand.splice(hi,1);
  G.actionDiscard.push(card);
  // 浪費癖: 追加コスト1枚(あれば)
  if(p.active&&p.active.card.trait==='rohisheki'&&p.actionHand.length>0){
    const burn=p.actionHand.splice(Math.floor(G.rng()*p.actionHand.length),1)[0];
    G.actionDiscard.push(burn); log(G,`${p.name}(浪費癖)が追加で1枚捨てた`);
  }
  log(G,`${p.name}が「${card.name}」を実行`);
  switch(card.key){
    case 'road_x': case 'road_t': case 'road_s': case 'road_c':
      if(target&&target.cell) changeRoad(G,target.cell,target.dirs);
      break;
    case 'akudakumi': {
      const same=G.actionDiscard.filter(c=>c.key==='akudakumi'&&c.id!==card.id).length;
      gainActions(G,p,same+1); break;
    }
    case 'rsm_card': { // 2枚追加で捨てて次の移動でワープ
      const extra=p.actionHand.filter(c=>c.key==='rsm_card').slice(0,2);
      if(extra.length>=2&&p.active){
        for(const e of extra){p.actionHand.splice(p.actionHand.indexOf(e),1);G.actionDiscard.push(e);}
        p.fx.warpDest=G.turn; log(G,`${p.name}: 次の移動で目的地へワープ！`);
      }
      break;
    }
    case 'nukemichi': p.fx.nukemichiTurn=G.turn; break;
    case 'heli': p.fx.heliTurn=G.turn; break;
    case 'idaten': p.fx.idatenUntil=G.turn+1; break;
    case 'jutai': G.fx.jutaiTurn=G.turn; break;
    case 'unkyu': G.fx.unkyuUntil=G.turn+1; break;
    case 'koji': if(target&&target.cell){G.fx.kojiCell=target.cell;G.fx.kojiTurn=G.turn;} break;
    case 'nikai': p.fx.nikaiTurn=G.turn; break;
    case 'otsukare': if(target&&target.charPi!=null){G.players[target.charPi].fx.frozenTurn=G.turn;
      log(G,`${G.players[target.charPi].name}のキャラは今ターン移動できない`);} break;
    case 'cancel': break; // 解決順制御側で処理
    case 'ontime': p.fx.freeRide=true; break;
    case 'matta': G.fx.mattaTurn=G.turn; break;
    case 'rosen': {
      G.rail=G.railDeck[Math.floor(G.rng()*G.railDeck.length)];
      G.boardStamp=(G.boardStamp||0)+1;
      log(G,`線路が${G.rail.name}に変更された`); break;
    }
    case 'assemble': {
      if(p.active){for(const q of G.players){if(q!==p&&q.active){q.active.cell=p.active.cell;q.active.cellSince=G.turn;}}
        log(G,'全キャラが集合した！');}
      break;
    }
    case 'kenshin': dayCard(G,c=>c.age>=60,'stop:hospital','病院'); break;
    case 'jishu':   dayCard(G,c=>c.age<=22,'stop:library','図書館'); break;
    case 'hojokin': dayCard(G,c=>c.age>=23&&c.age<=59,'stop:cityhall','市役所'); break;
    case 'drawkin': G.fx.drawkinTurn=G.turn; break;
  }
}
function dayCard(G,cond,req,label){
  const fk=req.split(':')[1];
  for(const q of G.players) if(q.active&&cond(q.active.card)){
    const cf=facilityAt(G.board,q.active.cell);
    if(cf&&cf.type==='special'&&cf.key===fk)continue; // 既にその施設にいるなら不要
    q.active.mustVisit.add(req);
    log(G,`${q.name}の「${q.active.card.name}」は${label}に止まるまで到着できない`);
  }
}
// 道路変更: dirs=['N','E'..] 施設なし・バス路線辺を壊さない
function canChangeRoad(G,cell,dirs){
  const B=G.board;
  if(facilityAt(B,cell)) return false;
  const [x,y]=cell.split(',').map(Number);
  for(const n of neighbors(B,cell)){
    const ek=edgeKey(x,y,...n.cell.split(',').map(Number));
    if(B.busEdges.has(ek)&&!dirs.includes(n.dir)) return false;
  }
  // 盤面が分断されないか
  const saved=new Set(B.edges);
  mutateRoad(B,cell,dirs);
  const ok=isConnected(B);
  B.edges=saved;
  return ok;
}
function mutateRoad(B,cell,dirs){
  const [x,y]=cell.split(',').map(Number);
  for(const n of neighbors(B,cell)){
    const ek=edgeKey(x,y,...n.cell.split(',').map(Number));
    if(dirs.includes(n.dir)) B.edges.add(ek); else B.edges.delete(ek);
  }
}
function changeRoad(G,cell,dirs){
  if(!canChangeRoad(G,cell,dirs)){log(G,'(道路変更は不可能だった)');return;}
  mutateRoad(G.board,cell,dirs);
  G.boardStamp=(G.boardStamp||0)+1;
  log(G,`${fmtCell(cell)}の道路が変わった`);
}
function isConnected(B){
  const start=B.stations[0]; const seen=new Set([start]); const q=[start];
  while(q.length){const c=q.pop(); for(const n of roadNeighbors(B,c)) if(!seen.has(n.cell)){seen.add(n.cell);q.push(n.cell);}}
  return seen.size===B.W*B.H;
}
function fmtCell(cell){const [x,y]=cell.split(',').map(Number);return String.fromCharCode(65+x)+(y+1);}
// セルを「ランドマーク基準」で説明(座標より分かりやすく)
function landmarkDesc(B,cell){
  const f=facilityAt(B,cell);
  if(f){
    if(f.type==='station')return STATION_NAMES[f.idx];
    if(f.type==='special')return FAC_INFO[f.key].name;
  }
  const lms=[
    ...B.stations.map((c,i)=>({c,n:STATION_NAMES[i]})),
    ...Object.keys(B.facilities).map(k=>({c:B.facilities[k],n:FAC_INFO[k].name})),
  ];
  const [x,y]=cell.split(',').map(Number);
  let best=null,bd=1e9;
  for(const lm of lms){
    const [lx,ly]=lm.c.split(',').map(Number);
    const d=Math.abs(lx-x)+Math.abs(ly-y);
    if(d<bd){bd=d;best=lm;}
  }
  const [lx,ly]=best.c.split(',').map(Number);
  const dx=x-lx,dy=y-ly;
  const dir=Math.abs(dx)>=Math.abs(dy)?(dx>0?'右':'左'):(dy>0?'下':'上');
  const what=f?(f.type==='busstop'?'バス停':'家'):'';
  if(bd<=2)return `${best.n}のすぐ${dir}${what?'の'+what:''}`;
  return `${best.n}から${dir}へ${bd}マス${what?'の'+what:''}`;
}

// ---- 移動 ----
function isBlocked(G,cell){return G.fx.kojiTurn===G.turn&&G.fx.kojiCell===cell;}
function akunoBlocked(G,pi,cell){
  return G.players.some(q=>q.i!==pi&&q.active&&q.active.cell===cell&&q.active.card.trait==='akuno');
}
function walkSteps(G,p){
  const a=p.active,t=a.card.trait;
  let s=2;
  if(t==='gyuho') return 1;
  if(t==='inou') s=3;
  if(t==='kyoho'&&!a.usedVehicle) s=3;
  if(t==='kakeashi'&&['bus','train','ride'].includes(a.lastMode)) s=4; // 降車直後の徒歩
  if(p.fx.idatenUntil>=G.turn) s=Math.max(s,4);
  return s;
}
// 徒歩: 到達可能 {cell, path}
function walkTargets(G,pi){
  const p=G.players[pi],a=p.active,B=G.board,t=a.card.trait;
  const maxS=walkSteps(G,p);
  const res=new Map();
  if(t==='uchujin'){ // 斜め含む8方向・道路無視・2マス
    const [x,y]=a.cell.split(',').map(Number);
    const frontier=[{cell:a.cell,path:[a.cell]}];
    let cur=[{cell:a.cell,path:[a.cell]}];
    for(let step=0;step<2;step++){
      const nxt=[];
      for(const st of cur){
        const [cx,cy]=st.cell.split(',').map(Number);
        for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
          if(!dx&&!dy)continue;
          const nx=cx+dx,ny=cy+dy;
          if(nx<0||nx>=B.W||ny<0||ny>=B.H)continue;
          const nc=CK(nx,ny);
          if(isBlocked(G,nc))continue;
          if(!res.has(nc)){const np=[...st.path,nc];res.set(nc,np);nxt.push({cell:nc,path:np});}
        }
      }
      cur=nxt;
    }
  } else {
    // BFS (幽霊: 未使用なら1回だけ非接続辺を通れる)
    const ghost=(t==='yurei'&&!a.yureiUsed)?1:0;
    const seen=new Map(); seen.set(a.cell+'|0',{path:[a.cell],g:0});
    let cur=[{cell:a.cell,g:0,path:[a.cell]}];
    for(let step=0;step<maxS;step++){
      const nxt=[];
      for(const st of cur){
        for(const n of neighbors(B,st.cell)){
          const hasRoad=B.edges.has(edgeKey(...st.cell.split(',').map(Number),...n.cell.split(',').map(Number)));
          let ng=st.g;
          if(!hasRoad){ if(st.g>=ghost) continue; ng=st.g+1; }
          if(isBlocked(G,n.cell)) continue;
          const k=n.cell+'|'+ng;
          if(seen.has(k)) continue;
          const np=[...st.path,n.cell];
          seen.set(k,{path:np,g:ng});
          nxt.push({cell:n.cell,g:ng,path:np});
          const steps=np.length-1;
          if(t==='skip'&&steps===1&&n.cell!==a.dest) {} // スキップ:1マス移動は目的地のみ
          else if(!res.has(n.cell)||res.get(n.cell).length>np.length) res.set(n.cell,np);
        }
      }
      cur=nxt;
    }
  }
  res.delete(a.cell);
  const out=[];
  for(const [cell,path] of res){
    if(akunoBlocked(G,pi,cell)) continue;
    out.push({mode:'walk',cell,path,ghost:t==='yurei'&&!a.yureiUsed&&pathUsesGhost(B,path)});
  }
  return out;
}
function pathUsesGhost(B,path){
  for(let i=0;i<path.length-1;i++)
    if(!B.edges.has(edgeKey(...path[i].split(',').map(Number),...path[i+1].split(',').map(Number)))) return true;
  return false;
}
// バス
function busTargets(G,pi){
  const p=G.players[pi],a=p.active,B=G.board,t=a.card.trait;
  if(t==='uchujin'||t==='inou')return[];
  const si=B.busStopCells.indexOf(a.cell);
  if(si<0)return[];
  if(a.cellSince>=G.turn)return[]; // このターンに来たばかり(待ち時間)
  if(vehNeedsPay(G,pi,'bus')&&p.actionHand.length===0)return[]; // 乗車代(アクションカード)が払えない
  let maxHop=2;
  if(G.fx.jutaiTurn===G.turn)maxHop=1;
  const minHop=(t==='inemuri')?2:1;
  if(minHop>maxHop)return[];
  const n=B.busStopCells.length,out=[];
  for(const dir of [1,-1]) for(let h=minHop;h<=maxHop;h++){
    const j=((si+dir*h)%n+n)%n;
    const cell=B.busStopCells[j];
    if(cell===a.cell)continue;
    if(isBlocked(G,cell)||akunoBlocked(G,pi,cell))continue;
    // 通過セル: ループ上の区間
    const path=busPath(B,si,j,dir);
    out.push({mode:'bus',cell,path,hops:h});
  }
  // 重複除去
  const m=new Map(); for(const o of out) if(!m.has(o.cell))m.set(o.cell,o);
  return [...m.values()];
}
function busPath(B,si,sj,dir){
  const li=B.busStopPos[si],lj=B.busStopPos[sj],L=B.busLoop.length,path=[];
  let i=li;
  while(true){path.push(B.busLoop[i]); if(i===lj)break; i=((i+dir)%L+L)%L;}
  return path;
}
// 電車
function trainTargets(G,pi){
  const p=G.players[pi],a=p.active,B=G.board,t=a.card.trait;
  if(t==='uchujin'||t==='inou')return[];
  if((G.fx.unkyuUntil||-1)>=G.turn)return[]; // 運休中
  const si=B.stations.indexOf(a.cell);
  if(si<0)return[];
  if(a.cellSince>=G.turn)return[];
  if(vehNeedsPay(G,pi,'train')&&p.actionHand.length===0)return[]; // 乗車代が払えない
  const adj={}; for(const [u,v] of G.rail.edges){(adj[u]=adj[u]||[]).push(v);(adj[v]=adj[v]||[]).push(u);}
  const maxHop=(t==='tetsuota')?2:1;
  const out=new Map();
  let cur=[si]; const dist={[si]:0};
  for(let h=1;h<=maxHop;h++){
    const nxt=[];
    for(const u of cur) for(const v of (adj[u]||[])) if(dist[v]==null){dist[v]=h;nxt.push(v);
      const cell=B.stations[v];
      if(!isBlocked(G,cell)&&!akunoBlocked(G,pi,cell)) out.set(cell,{mode:'train',cell,path:[a.cell,cell],hops:h});
    }
    cur=nxt;
  }
  return [...out.values()];
}
// 乗り物に「新規乗車代(アクションカード1枚)」が要るか。乗り継ぎ(前回と同じ乗り物)は無料
function vehNeedsPay(G,pi,mode){
  if(G.noActions)return false; // かんたんは無料
  const a=G.players[pi].active; if(!a)return false;
  if(mode==='ride')return !a.usedRideFree; // 配車は毎回(無料クーポン時を除く)
  return a.lastMode!==mode; // バス/電車は乗り継ぎなら無料
}
// ライドシェア(即時配車: 家(相手所有以外)or交通空白マス)
function canRideFrom(G,pi,cell){
  const B=G.board,p=G.players[pi];
  // 原作準拠: そのキャラが出発した家(自宅)からは配車できない
  if(p.active&&p.active.home===cell)return false;
  if(B.desert.has(cell))return true;
  if(!B.houses.includes(cell))return false;
  for(const q of G.players){ if(q.i===pi)continue;
    if(q.houses.includes(cell))return false; }
  return true;
}
function ridePayOptions(G,pi){ // 配車の支払い方法一覧
  const p=G.players[pi],opts=[];
  if(p.fx.freeRide)opts.push({type:'free'});
  if(G.noActions){
    // かんたんモード: アクションカードが無いのでキャラカードで配車(原作準拠)
    if(p.charHand.length>neededReserve(G,p))
      for(const c of p.charHand)opts.push({type:'char',cardId:c.id});
  }else{
    // 通常: 手札のアクションカード1枚を捨てて配車(ライドシェアマンカードも可)
    for(const c of p.actionHand)opts.push({type:'action',cardId:c.id});
  }
  return opts;
}
function rideTargets(G,pi){
  const p=G.players[pi],a=p.active,B=G.board,t=a.card.trait;
  if(t==='uchujin'||t==='inou')return[];
  if(!canRideFrom(G,pi,a.cell))return[];
  if(ridePayOptions(G,pi).length===0)return[];
  let maxS=(t==='rsman')?6:5;
  if(G.fx.jutaiTurn===G.turn)maxS=3;
  // 道路沿いBFS
  const res=new Map(); res.set(a.cell,[a.cell]);
  let cur=[{cell:a.cell,path:[a.cell]}];
  for(let s=0;s<maxS;s++){
    const nxt=[];
    for(const st of cur) for(const n of roadNeighbors(B,st.cell)){
      if(isBlocked(G,n.cell))continue;
      if(res.has(n.cell))continue;
      const np=[...st.path,n.cell]; res.set(n.cell,np); nxt.push({cell:n.cell,path:np});
    }
    cur=nxt;
  }
  res.delete(a.cell);
  const out=[];
  for(const [cell,path] of res){ if(akunoBlocked(G,pi,cell))continue; out.push({mode:'ride',cell,path}); }
  return out;
}
// 特殊移動(カード効果)
function specialTargets(G,pi){
  const p=G.players[pi],a=p.active,B=G.board,out=[];
  if(p.fx.warpDest===G.turn) out.push({mode:'warp',cell:a.dest,path:[a.cell,a.dest],label:'目的地ワープ'});
  if(p.fx.heliTurn===G.turn&&!facilityAt(B,a.cell))
    for(const k in B.facilities){const c=B.facilities[k];
      if(!isBlocked(G,c)&&!akunoBlocked(G,pi,c))out.push({mode:'heli',cell:c,path:[a.cell,c],label:'ヘリ:'+FAC_INFO[k].name});}
  if(p.fx.nukemichiTurn===G.turn)
    for(const n of neighbors(B,a.cell)){
      const hasRoad=B.edges.has(edgeKey(...a.cell.split(',').map(Number),...n.cell.split(',').map(Number)));
      if(!hasRoad&&!isBlocked(G,n.cell)&&!akunoBlocked(G,pi,n.cell))
        out.push({mode:'nukemichi',cell:n.cell,path:[a.cell,n.cell],label:'抜け道'});
    }
  return out;
}
function canMoveThisTurn(G,pi){
  const p=G.players[pi],a=p.active;
  if(!a)return false;
  if(p.fx.frozenTurn===G.turn)return false;
  if(a.card.trait==='chikoku'&&G.turn<a.placedTurn+2)return false;
  return true;
}
function allMoves(G,pi){
  const _a=G.players[pi].active;
  if(_a){ const _f=facilityAt(G.board,_a.cell);
    if(_f&&_f.type==='special'){_a.mustVisit.delete('stop:'+_f.key);_a.mustVisit.delete('pass:'+_f.key);} }
  if(!canMoveThisTurn(G,pi))return[];
  return [...specialTargets(G,pi),...walkTargets(G,pi),...busTargets(G,pi),...trainTargets(G,pi),...rideTargets(G,pi)];
}
// 到着可能か(移動前に判定: prevCell/prevSince=移動前の位置と滞在開始ターン)
function canArrive(G,pi,viaMoveEndCell,pathCells,prevCell,prevSince){
  const p=G.players[pi],a=p.active,B=G.board;
  if(prevCell===undefined){prevCell=a.cell;prevSince=a.cellSince;}
  if(viaMoveEndCell!==a.dest)return false;
  if(G.fx.mattaTurn===G.turn)return false;
  const t=a.card.trait;
  if(t==='hokohei'){
    // 目的地の隣に前ターンから居た場合のみ到着できる
    const adjRoads=roadNeighbors(B,a.dest).map(n=>n.cell);
    if(!(adjRoads.includes(prevCell)&&prevSince<G.turn))return false;
  }
  // この移動で解消される必須訪問を考慮
  const remaining=new Set(a.mustVisit);
  for(const c of (pathCells||[])){
    const f=facilityAt(B,c);
    if(f&&f.type==='special')remaining.delete('pass:'+f.key);
  }
  const fEnd=facilityAt(B,viaMoveEndCell);
  if(fEnd&&fEnd.type==='special')remaining.delete('stop:'+fEnd.key);
  if(remaining.size>0)return false;
  return true;
}
// 移動適用。moveは allMoves の要素。payment はride時 {type,cardId}
function applyMove(G,pi,move,payment){
  const p=G.players[pi],a=p.active,B=G.board;
  const events=[];
  if(move.mode==='ride'){
    const pay=payment||ridePayOptions(G,pi)[0]||{type:'free'};
    if(pay.type==='free'){p.fx.freeRide=false;log(G,`${p.name}が無料クーポンで配車した`);}
    else if(pay.type==='action'){
      let i;
      if(pay.cardId!=null){i=p.actionHand.findIndex(c=>c.id===pay.cardId);}
      else{ // 自動: 一番価値の低い1枚
        i=0;let bs=1e9;for(let k=0;k<p.actionHand.length;k++){const sc=cardFitScore(G,p,p.actionHand[k]);if(sc<bs){bs=sc;i=k;}}
      }
      if(i>=0&&i<p.actionHand.length)G.actionDiscard.push(p.actionHand.splice(i,1)[0]);
      log(G,`${p.name}がアクションカード1枚を捨てて配車した`);
    } else if(pay.type==='char'){
      const i=p.charHand.findIndex(c=>c.id===pay.cardId);
      if(i>=0){const c=p.charHand.splice(i,1)[0]; G.charDiscard.push(c);
        log(G,`${p.name}が「${c.name}」のカードを手放して配車した`);}
    }
  } else if((move.mode==='bus'||move.mode==='train') && vehNeedsPay(G,pi,move.mode)){
    // バス/電車の新規乗車: アクションカード1枚を捨てる(自動で価値の低いものを)
    if(p.actionHand.length>0){
      let bi=0,bs=1e9;
      for(let i=0;i<p.actionHand.length;i++){const sc=cardFitScore(G,p,p.actionHand[i]);if(sc<bs){bs=sc;bi=i;}}
      G.actionDiscard.push(p.actionHand.splice(bi,1)[0]);
      log(G,`${p.name}が${modeName(move.mode)}の乗車券にアクションカード1枚を使った`);
    }
  }
  if(move.mode==='warp')p.fx.warpDest=-1;
  if(move.mode==='heli')p.fx.heliTurn=-1;
  if(move.mode==='nukemichi')p.fx.nukemichiTurn=-1;
  if(move.ghost)a.yureiUsed=true;
  const prevCell=a.cell, prevSince=a.cellSince;
  const arrivalOk=canArrive(G,pi,move.cell,move.path,prevCell,prevSince);
  // 乗車記録
  const vehicle=['bus','train','ride'].includes(move.mode);
  if(vehicle){a.usedVehicle=true;}
  if(move.mode==='ride'){a.usedRideFree=false;}
  if(a.lastMode&&['bus','train','ride'].includes(a.lastMode)&&move.mode==='walk')a.leftVehicleTurn=G.turn;
  a.lastMode=move.mode;
  a.cell=move.cell; a.cellSince=G.turn;
  a.path=move.path;
  // 通過による mustVisit 解消(pass:)
  for(const c of move.path){
    const f=facilityAt(B,c);
    if(f&&f.type==='special'){
      a.mustVisit.delete('pass:'+f.key);
    }
  }
  // 停止による解消(stop:)
  const f=facilityAt(B,a.cell);
  if(f&&f.type==='special')a.mustVisit.delete('stop:'+f.key);
  log(G,`${p.name}の「${a.card.name}」が${modeName(move.mode)}で${fmtCell(a.cell)}へ`);
  // 特殊マス停止でドロー
  if(f&&f.type==='special'){
    const n=(a.card.trait==='rohisheki'&&f.key==='super')?2:1;
    gainActions(G,p,n); events.push({type:'specialDraw',n});
  }
  // 到着判定
  if(arrivalOk) arrive(G,pi,events);
  return events;
}
// その場到着(方向音痴などで既に目的地にいる/隣にいる場合の"到着宣言")
function canDeclareArrive(G,pi){
  const p=G.players[pi],a=p.active;
  if(!a)return false;
  if(!canMoveThisTurn(G,pi))return false;
  if(a.card.trait==='hokohei'){
    const adj=roadNeighbors(G.board,a.dest).map(n=>n.cell);
    return adj.includes(a.cell)&&a.cellSince<G.turn&&G.fx.mattaTurn!==G.turn&&a.mustVisit.size===0;
  }
  return a.cell===a.dest&&canArrive(G,pi,a.cell,[a.cell]);
}
function declareArrive(G,pi){
  const p=G.players[pi],a=p.active,events=[];
  if(a.card.trait==='hokohei'&&a.cell!==a.dest){a.cell=a.dest;a.cellSince=G.turn;}
  arrive(G,pi,events); return events;
}
function arrive(G,pi,events){
  const p=G.players[pi],a=p.active;
  let pts=a.card.pts;
  if(a.card.trait==='ichiban'&&!G.firstArrivalDone)pts=a.card.pts+3; // 最初の到着で+3点
  G.firstArrivalDone=true;
  p.journeys++; p.usedPts+=pts;
  p.arrivalTurnOrder=(G.arrivalCounter=(G.arrivalCounter||0)+1);
  log(G,`🎉 ${p.name}の「${a.card.name}」が${a.destLabel}に到着！(${p.usedPts}/${G.goalPts||18}点)`);
  const t=a.card.trait;
  if(t==='dorobo'){
    const opps=G.players.filter(q=>q.i!==pi&&q.actionHand.length>0);
    if(opps.length){const q=opps[Math.floor(G.rng()*opps.length)];
      const c=q.actionHand.splice(Math.floor(G.rng()*q.actionHand.length),1)[0];
      p.actionHand.push(c); log(G,`${p.name}(泥棒)が${q.name}からカードを1枚奪った`);}
  } else if(t==='lucky'){
    gainActions(G,p,2);
    if(p.actionHand.length>0){const c=p.actionHand.splice(Math.floor(G.rng()*p.actionHand.length),1)[0];G.actionDiscard.push(c);}
    log(G,`${p.name}(ラッキーマン)は2枚引いて1枚捨てた`);
  } else {
    gainActions(G,p,1); // ルール4: 到着で1枚ドロー
  }
  p.active=null;
  if(p.usedPts<(G.goalPts||18)&&p.charHand.length>0&&p.dests.some((d,i)=>!p.usedDests.includes(i)))p.needsPlacement=true;
  events.push({type:'arrive',pi});
}

// ---- ターン進行 ----
// 終了フェイズ: 手札(アクション)6枚以上なら5枚まで捨てる。捨てた枚数を返す
function endPhaseDiscard(G,p){
  const over=p.actionHand.length-5;
  if(over<=0)return [];
  const dumped=[];
  for(let k=0;k<over;k++){
    let bi=0,bs=1e9;
    for(let i=0;i<p.actionHand.length;i++){const sc=cardFitScore(G,p,p.actionHand[i]);if(sc<bs){bs=sc;bi=i;}}
    const c=p.actionHand.splice(bi,1)[0];G.actionDiscard.push(c);dumped.push(c);
  }
  if(dumped.length)log(G,`${p.name}は手札上限で${dumped.map(c=>'「'+c.name+'」').join('')}を捨てた`);
  return dumped;
}
function endTurn(G){
  const goal=G.goalPts||18;
  // 勝利判定(合計18点以上。同一ターン複数達成は得点→到着順で比較)
  const done=G.players.filter(p=>p.usedPts>=goal);
  if(done.length>0){
    done.sort((x,y)=>{
      if(y.usedPts!==x.usedPts)return y.usedPts-x.usedPts;
      return (x.arrivalTurnOrder||99)-(y.arrivalTurnOrder||99);
    });
    G.winner=done[0];
    G.ranking=currentRanking(G);
    G.phase='over';
    log(G,`🏆 ${G.winner.name}の勝利！`);
    return true;
  }
  G.turn++;
  G.startPlayer=(G.startPlayer+1)%G.players.length;
  return false;
}
// 現時点の順位(得点→到着数→到着順)。上位ほど前
function currentRanking(G){
  return [...G.players].sort((x,y)=>{
    if(y.usedPts!==x.usedPts)return y.usedPts-x.usedPts;
    if(y.journeys!==x.journeys)return y.journeys-x.journeys;
    return (x.arrivalTurnOrder||99)-(y.arrivalTurnOrder||99);
  });
}
function modeName(m){return {walk:'徒歩',bus:'バス',train:'電車',ride:'ライドシェア',warp:'ワープ',heli:'ヘリ',nukemichi:'抜け道'}[m]||m;}
function turnOrder(G){const n=G.players.length,o=[];for(let k=0;k<n;k++)o.push((G.startPlayer+k)%n);return o;}

function needsTarget(card){return ['cell','character','card','road'].includes(card.target);}
// アクションフェイズ解決ジェネレータ。yield {type:'target',pi,card,revealed} → next(target)
function* actionPhaseGen(G,choices){
  const order=resolveOrder(G,choices);
  if(order.length)log(G,'--- アクション同時公開: '+order.map(o=>`${G.players[o.pi].name}「${o.card.name}」`).join(' / '));
  const cancelled=new Set();
  for(const {pi,card} of order){
    const p=G.players[pi];
    if(cancelled.has(card.id)){
      const hi=p.actionHand.findIndex(c=>c.id===card.id);
      if(hi>=0){G.actionDiscard.push(p.actionHand.splice(hi,1)[0]);}
      log(G,`${p.name}の「${card.name}」は無効化された`);
      yield {type:'cancelled',pi,card};
      continue;
    }
    let target=null;
    if(needsTarget(card)) target=yield {type:'target',pi,card,revealed:order};
    if(card.key==='cancel'&&target&&target.cancelId){
      cancelled.add(target.cancelId);
      const victim=order.find(o=>o.card.id===target.cancelId);
      if(victim)log(G,`${p.name}が${G.players[victim.pi].name}の「${victim.card.name}」をキャンセル！`);
    }
    applyAction(G,pi,card,target);
    yield {type:'resolved',pi,card,target};
  }
  // 実行しなかったプレイヤーは1枚引く
  for(const pi of turnOrder(G)){
    if(!choices[pi]||!choices[pi].cardId) gainActions(G,G.players[pi],1);
  }
}

// ===== CPU AI =====
"use strict";

// 目的地からの残りターン数フィールド(逆向きDijkstra、キャッシュ付き)
// フィールドはボード状態(道路/線路)が変わると無効化
function estField(G,pi,destCell,opt){
  opt=opt||{};
  const walkS=opt.walkS||2, rideS=opt.rideOk?5:0;
  G._fieldCache=G._fieldCache||{};
  const key=destCell+'|'+walkS+'|'+rideS+'|'+pi+'|'+(G.boardStamp||0);
  if(G._fieldCache[key])return G._fieldCache[key];
  const B=G.board;
  const dist={}; dist[destCell]=0;
  // 二分ヒープ
  const hq=[[0,destCell]];
  const hpush=(it)=>{hq.push(it);let i=hq.length-1;
    while(i>0){const p=(i-1)>>1;if(hq[p][0]<=hq[i][0])break;[hq[p],hq[i]]=[hq[i],hq[p]];i=p;}};
  const hpop=()=>{const top=hq[0],last=hq.pop();
    if(hq.length){hq[0]=last;let i=0;
      while(true){const l=2*i+1,r=l+1;let m=i;
        if(l<hq.length&&hq[l][0]<hq[m][0])m=l;
        if(r<hq.length&&hq[r][0]<hq[m][0])m=r;
        if(m===i)break;[hq[m],hq[i]]=[hq[i],hq[m]];i=m;}}
    return top;};
  const pq={get length(){return hq.length;},push:hpush};
  const adj=getAdj(G);
  while(hq.length){
    const [d,c]=hpop();
    if(d>(dist[c]??1e9))continue;
    // c に1手で来られるマス b を緩和
    const maxR=Math.max(walkS,rideS);
    const reach=bfsStepsAdj(adj,c,maxR);
    for(const [b,st] of reach){
      let nd=1e9;
      if(st<=walkS)nd=d+1;
      else if(rideS&&st<=rideS&&canRideFrom(G,pi,b))nd=d+1;
      if(nd<(dist[b]??1e9)){dist[b]=nd;pq.push([nd,b]);}
    }
    // rideS>walkS の場合、walk圏内のride起点も拾う
    if(rideS)for(const [b,st] of reach){
      if(st<=rideS&&canRideFrom(G,pi,b)){const nd=d+1;
        if(nd<(dist[b]??1e9)){dist[b]=nd;pq.push([nd,b]);}}
    }
    // バス(対称)
    const si=B.busStopCells.indexOf(c);
    if(si>=0){const n=B.busStopCells.length;
      for(const dir of [1,-1])for(let h=1;h<=2;h++){
        const b=B.busStopCells[((si+dir*h)%n+n)%n];
        const nd=d+1.5;
        if(nd<(dist[b]??1e9)){dist[b]=nd;pq.push([nd,b]);}
      }}
    // 電車(対称)
    const ti=B.stations.indexOf(c);
    if(ti>=0){for(const [u,v] of G.rail.edges){
      let o=-1; if(u===ti)o=v; else if(v===ti)o=u;
      if(o>=0){const b=B.stations[o],nd=d+1.5;
        if(nd<(dist[b]??1e9)){dist[b]=nd;pq.push([nd,b]);}}
    }}
  }
  G._fieldCache[key]=dist;
  // キャッシュ肥大防止
  if(Object.keys(G._fieldCache).length>60)G._fieldCache={[key]:dist};
  return dist;
}
function estTurns(G,pi,fromCell,destCell,opt){
  const f=estField(G,pi,destCell,opt);
  return f[fromCell]??99;
}
function getAdj(G){
  const stamp=G.boardStamp||0;
  if(G._adjCache&&G._adjCache.stamp===stamp)return G._adjCache.adj;
  const adj={};
  for(const ek of G.board.edges){
    const [a,b]=ek.split('|');
    (adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);
  }
  G._adjCache={stamp,adj};
  return adj;
}
function bfsStepsAdj(adj,from,k){
  const res=new Map();res.set(from,0);
  let cur=[from];
  for(let s=1;s<=k;s++){
    const nxt=[];
    for(const c of cur)for(const n of (adj[c]||[]))
      if(!res.has(n)){res.set(n,s);nxt.push(n);}
    cur=nxt;
  }
  res.delete(from);
  return res;
}
function bfsSteps(B,from,k){ // 互換API(遅い方)
  const res=new Map();res.set(from,0);
  let cur=[from];
  for(let s=1;s<=k;s++){
    const nxt=[];
    for(const c of cur)for(const n of roadNeighbors(B,c))
      if(!res.has(n.cell)){res.set(n.cell,s);nxt.push(n.cell);}
    cur=nxt;
  }
  res.delete(from);
  return res;
}

// --- セットアップ: 家3軒選び+次プレイヤーの目的地3つ指名 ---
function aiSetup(G,pi,takenHouses){
  const B=G.board;
  const free=B.houses.filter(h=>!takenHouses.has(h));
  const cands=destCandidates(G).filter(d=>!takenHouses.has(d.cell));
  // 家の便利さ評価はハブ施設(駅+特殊)への近さで見る(高速化)
  const hubs=cands.filter(d=>d.type==='station'||d.type==='special');
  const scored=free.map(h=>{
    let best=99;
    for(const d of hubs)best=Math.min(best,estTurns(G,pi,h,d.cell,{rideOk:true}));
    return {h,score:best+G.rng()*1.5};
  }).sort((a,b)=>a.score-b.score);
  const houses=scored.slice(0,3).map(s=>s.h);
  // 相手への目的地: 候補からサンプリングして遠い所を選ぶ
  const pool=[...cands];
  shuffle(pool,G.rng);
  const sample=pool.slice(0,Math.min(20,pool.length));
  const destScored=sample.map(d=>{
    let sum=0;
    for(const h of houses)sum+=estTurns(G,pi,h,d.cell,{rideOk:false});
    return {d,score:-sum+G.rng()*2};
  }).sort((a,b)=>a.score-b.score);
  const dests=destScored.slice(0,destCount(G)).map(s=>s.d);
  return {houses,dests};
}
// ランダム目的地(難易度調整用)
function randomDests(G,exclude){
  const cands=destCandidates(G).filter(d=>!exclude.has(d.cell));
  shuffle(cands,G.rng);
  return cands.slice(0,destCount(G));
}

// --- ドラフト ---
const TRAIT_AI_SCORE={rsman:9,kyoho:8,kakeashi:7,tetsuota:7,ichiban:7,lucky:6,dorobo:6,bbass:6,yurei:6,akuno:5,
  inou:5,uchujin:4,skip:4,inemuri:4,hokohei:3,rohisheki:2,byonin:2,ronin:2,gyuho:1,chikoku:1};
function aiDraftPick(G,pi,pack){
  const p=G.players[pi];
  const hiPts=p.charHand.filter(c=>c.pts>=5).length;
  let best=pack[0],bs=-99;
  for(const c of pack){
    // 使いやすさ(特徴) + 高得点ほど旅の回数が減るので少し加点
    let s=(TRAIT_AI_SCORE[c.trait]||3)*0.7 + (c.pts-3)*1.2;
    if(hiPts>=3&&c.pts<=3)s+=1; // 高得点ばかりなら扱いやすい低得点も混ぜる
    s+=G.rng();
    if(s>bs){bs=s;best=c;}
  }
  return best.id;
}

// --- 配置 ---
function aiPlace(G,pi){
  const p=G.players[pi];
  let best=null,bs=1e9;
  for(const ch of p.charHand){
    if(p.charHand.length-1<neededReserve(G,p))continue;
    for(const h of p.houses){
      for(let di=0;di<p.dests.length;di++){
        if(p.usedDests.includes(di))continue;
        const walkS=ch.trait==='gyuho'?1:ch.trait==='inou'?3:2;
        const rideOk=!['uchujin','inou'].includes(ch.trait);
        let t=estTurns(G,pi,h,p.dests[di].cell,{walkS,rideOk});
        t+=(ch.pts-1)*0.5; // 高得点=扱いにくい
        if(ch.trait==='chikoku')t+=2;
        if(ch.trait==='byonin')t+=estTurns(G,pi,h,G.board.facilities.hospital,{rideOk})*0.5;
        if(ch.trait==='ronin')t+=estTurns(G,pi,h,G.board.facilities.library,{rideOk})*0.5;
        if(t<bs){bs=t;best={charId:ch.id,house:h,destIdx:di};}
      }
    }
  }
  // 保険: 全部ダメなら最初の合法手
  if(!best){
    const ch=p.charHand[0],h=p.houses[0];
    const di=p.dests.findIndex((_,i)=>!p.usedDests.includes(i));
    best={charId:ch.id,house:h,destIdx:di};
  }
  return best;
}

// --- アクションフェイズの選択 {cardId|null} ---
function aiChooseAction(G,pi){
  const p=G.players[pi],a=p.active;
  if(!a)return {cardId:null};
  const myT=estTurns(G,pi,a.cell,a.dest,{rideOk:true});
  // 敵の最短
  let danger=null,dT=99;
  for(const q of G.players){ if(q.i===pi||!q.active)continue;
    const t=estTurns(G,q.i,q.active.cell,q.active.dest,{rideOk:true});
    if(t<dT){dT=t;danger=q;}
  }
  const has=k=>p.actionHand.find(c=>c.key===k);
  // 勝ち手: ワープ(rsm3枚)
  const rsmN=p.actionHand.filter(c=>c.key==='rsm_card').length;
  if(rsmN>=3&&myT>1.6)return {cardId:has('rsm_card').id};
  // 相手が上がりそうなら妨害
  if(danger&&dT<=1.2){
    if(has('matta'))return {cardId:has('matta').id};
    if(has('otsukare'))return {cardId:has('otsukare').id,target:{charPi:danger.i}};
    if(has('jutai'))return {cardId:has('jutai').id};
  }
  if(danger&&dT<=2.2&&G.rng()<0.5){
    if(has('otsukare'))return {cardId:has('otsukare').id,target:{charPi:danger.i}};
    if(has('unkyu')&&G.board.stations.includes(danger.active.cell))return {cardId:has('unkyu').id};
  }
  // 自分の加速
  if(has('heli')&&!facilityAt(G.board,a.cell)){
    // 目的地が特殊施設か、必須訪問先がある場合
    const specials=Object.values(G.board.facilities);
    if(specials.includes(a.dest)||a.mustVisit.size>0)return {cardId:has('heli').id};
  }
  if(has('idaten')&&myT>2)return {cardId:has('idaten').id};
  if(has('nikai')&&myT>2.5)return {cardId:has('nikai').id};
  if(has('akudakumi')&&G.actionDiscard.filter(c=>c.key==='akudakumi').length>=1)return {cardId:has('akudakumi').id};
  if(has('kenshin')){const hit=G.players.filter(q=>q.i!==pi&&q.active&&q.active.card.age>=60).length;
    if(hit>0&&!(a.card.age>=60))return {cardId:has('kenshin').id};}
  if(has('jishu')){const hit=G.players.filter(q=>q.i!==pi&&q.active&&q.active.card.age<=22).length;
    if(hit>0&&!(a.card.age<=22))return {cardId:has('jishu').id};}
  if(has('hojokin')){const hit=G.players.filter(q=>q.i!==pi&&q.active&&q.active.card.age>=23&&q.active.card.age<=59).length;
    if(hit>0&&!(a.card.age>=23&&a.card.age<=59))return {cardId:has('hojokin').id};}
  if(has('rosen')&&G.rng()<0.25)return {cardId:has('rosen').id};
  // 盤面変更: 自分の道がグッと縮むなら道路カードを使う
  for(const rk of ['road_x','road_t','road_s','road_c']){
    const rc=has(rk);
    if(rc&&G.rng()<0.7){
      const tgt=aiActionTarget(G,pi,rc,[]);
      if(tgt)return {cardId:rc.id,target:tgt};
    }
  }
  // 手札が多いなら何か使う、少ないなら引く
  if(p.actionHand.length<=3)return {cardId:null};
  if(has('ontime')&&!G.noActions&&p.actionHand.length<=2)return {cardId:has('ontime').id};
  return {cardId:null};
}
// 解決時ターゲット
function aiActionTarget(G,pi,card,revealed){
  const p=G.players[pi];
  if(card.key==='otsukare'){
    let best=null,bt=99;
    for(const q of G.players){if(q.i===pi||!q.active)continue;
      const t=estTurns(G,q.i,q.active.cell,q.active.dest,{rideOk:true});
      if(t<bt){bt=t;best=q.i;}}
    return best!=null?{charPi:best}:null;
  }
  if(card.key==='koji'){
    // 一番近い敵の目的地の隣をふさぐ
    let best=null,bt=99;
    for(const q of G.players){if(q.i===pi||!q.active)continue;
      const t=estTurns(G,q.i,q.active.cell,q.active.dest,{rideOk:true});
      if(t<bt){bt=t;best=q;}}
    if(best){
      for(const n of roadNeighbors(G.board,best.active.dest))
        if(!facilityAt(G.board,n.cell)&&n.cell!==best.active.cell)return {cell:n.cell};
    }
    return null;
  }
  if(card.key==='cancel'){
    // 自分以外の一番危険なカードを無効化
    const others=revealed.filter(r=>r.pi!==pi&&r.card.key!=='cancel');
    if(others.length)return {cancelId:others[0].card.id};
    return null;
  }
  if(card.target==='road'){
    // 自分の徒歩距離が縮む道路変更を探す(現在地〜目的地の矩形内)
    const a=p.active; if(!a)return null;
    const B=G.board;
    const base=bfsWalkDist(B,a.cell,a.dest);
    if(base<0)return null;
    const [ax,ay]=a.cell.split(',').map(Number),[dx2,dy2]=a.dest.split(',').map(Number);
    const x0=Math.max(0,Math.min(ax,dx2)-1),x1=Math.min(B.W-1,Math.max(ax,dx2)+1);
    const y0=Math.max(0,Math.min(ay,dy2)-1),y1=Math.min(B.H-1,Math.max(ay,dy2)+1);
    let best=null,bestGain=1.9; // 徒歩2マス分以上縮むときだけ使う
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
      const c=x+','+y;
      if(facilityAt(B,c))continue;
      for(const dirs of ROAD_SHAPES[card.key]){
        if(!canChangeRoad(G,c,dirs))continue;
        const saved=new Set(B.edges);
        mutateRoad(B,c,dirs);
        const t=bfsWalkDist(B,a.cell,a.dest);
        B.edges=saved;
        if(t<0)continue;
        const gain=base-t;
        if(gain>bestGain){bestGain=gain;best={cell:c,dirs};}
      }
    }
    return best;
  }
  return null;
}

// --- 移動 ---
function aiMove(G,pi){
  const p=G.players[pi],a=p.active;
  if(canDeclareArrive(G,pi))return {declare:true};
  const moves=allMoves(G,pi);
  if(moves.length===0)return null;
  let best=null,bs=1e9;
  const reserveOk=p.charHand.length>neededReserve(G,p);
  // 必須訪問先があればまずそこへ
  let goal=a.dest;
  for(const req of a.mustVisit){const k=req.split(':')[1];goal=G.board.facilities[k];break;}
  for(const m of moves){
    // 到着できるなら即
    if(canArrive(G,pi,m.cell,m.path)){best=m;bs=-1;break;}
    // 到着できないのに自分の目的地マスに乗るのは無意味
    if(m.cell===a.dest&&goal===a.dest)continue;
    let t=estTurns(G,pi,m.cell,goal,{rideOk:reserveOk});
    // 訪問後に目的地へ向かう距離も薄く加味
    if(goal!==a.dest)t+=estTurns(G,pi,goal,a.dest,{rideOk:reserveOk})*0.2;
    if(m.mode==='ride'){
      t+=0.6; // キャラカードの重み
      if(p.fx.freeRide||p.actionHand.some(c=>c.key==='rsm_card'))t-=0.55;
    }
    // 特殊マス停止ドローを少し評価
    const f=facilityAt(G.board,m.cell);
    if(f&&f.type==='special')t-=0.3;
    if(t<bs){bs=t;best=m;}
  }
  // かんたん/ふつう: CPUはときどき最善でない手を選ぶ(到着できる時は除く)
  if(G.aiNoise&&bs>=0&&G.rng()<G.aiNoise){
    const others=moves.filter(m=>m!==best&&m.mode==='walk'&&m.cell!==a.dest);
    if(others.length){
      const pick=others[Math.floor(G.rng()*others.length)];
      return {move:pick};
    }
  }
  // 乗り物の支払い方法を決める
  const ridePayFor=()=>{
    const pays=ridePayOptions(G,pi);
    let pay=pays.find(x=>x.type==='free')||pays.find(x=>x.type==='action');
    if(!pay){
      const chars=pays.filter(x=>x.type==='char');
      chars.sort((x,y)=>{
        const cx=p.charHand.find(c=>c.id===x.cardId),cy=p.charHand.find(c=>c.id===y.cardId);
        return (TRAIT_AI_SCORE[cx.trait]||3)-(TRAIT_AI_SCORE[cy.trait]||3);
      });
      pay=chars[0];
    }
    return pay;
  };
  const wrap=m=>!m?null:(m.mode==='ride'?{move:m,payment:ridePayFor()}:{move:m});
  // 現状より悪化しかしない場合の処理
  const stay=estTurns(G,pi,a.cell,goal,{rideOk:reserveOk});
  if(best&&bs>=stay+0.9&&!canArrive(G,pi,best.cell,best.path)){
    const B=G.board;
    const atStop=B.busStopCells.includes(a.cell)||B.stations.includes(a.cell);
    // バス停・駅に来たばかりなら「次ターン乗車」のため待機は有効
    if(atStop&&a.cellSince>=G.turn)return null;
    // 無限パス防止: 実際の徒歩距離を縮める手にフォールバックして必ず前進
    const curd=bfsWalkDist(B,a.cell,goal);
    let alt=null,ad=1e9;
    for(const m of moves){
      if(m.cell===a.cell)continue;
      if(m.cell===a.dest&&goal===a.dest&&!canArrive(G,pi,m.cell,m.path))continue;
      const d=bfsWalkDist(B,m.cell,goal);
      if(d>=0&&d<ad){ad=d;alt=m;}
    }
    if(alt&&(curd<0||ad<curd))return wrap(alt);
    return null;
  }
  return wrap(best);
}

// ヒント用: 難易度ノイズを外した全力の一手(CPUの手加減と無関係)
function aiBestMove(G,pi){
  const n=G.aiNoise; G.aiNoise=0;
  try{ return aiMove(G,pi); } finally{ G.aiNoise=n; }
}

const SND={ac:null,bgm:null,
  bgmOn:(function(){try{return localStorage.getItem('rsg_bgm')!=='0';}catch(e){return true;}})(),
  seOn:(function(){try{return localStorage.getItem('rsg_se')!=='0';}catch(e){return true;}})(),
  init(){
    if(!this.ac){try{this.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ac&&this.ac.state==='suspended')this.ac.resume();
  },
  syncBgm(inGame){(this.bgmOn&&inGame)?BGM.start():BGM.stop();},

  toggleSe(){this.seOn=!this.seOn;store('rsg_se',this.seOn?'1':'0');},
  tone(fr,dur,opt){if(!this.seOn||!this.ac)return;opt=opt||{};
    const t0=this.ac.currentTime+(opt.at||0);
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=opt.type||'sine';o.frequency.setValueAtTime(fr,t0);
    if(opt.slide)o.frequency.exponentialRampToValueAtTime(opt.slide,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(opt.vol||0.15,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(this.ac.destination);
    o.start(t0);o.stop(t0+dur+0.05);},
};
// ---- BGM: ピコピコ・チップチューン(生成音、継ぎ目なしループ) ----
const BGM={
  timer:null,step:0,nextT:0,
  SPB:60/132/2, // 132BPMの8分音符
  setRate(r){this.SPB=(60/132/2)/(r||1);}, // リーチで加速
  f(m){return 440*Math.pow(2,(m-69)/12);},
  // 8小節ループ(Am→F→C→G ×2)。0=休符
  mel:[76,0,72,0,69,0,72,74, 72,0,69,0,65,0,69,72,
       67,0,72,0,76,0,74,72, 74,0,71,0,67,0,69,71,
       76,0,72,0,69,0,72,74, 72,0,69,0,65,0,69,72,
       67,0,72,0,76,0,74,76, 74,76,74,71,67,0,74,0],
  roots:[45,41,48,43,45,41,48,43], // A2 F2 C3 G2
  osc(type,fr,t,dur,vol){
    const ac=SND.ac,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(fr,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.03);
  },
  playStep(st,t){
    const m=this.mel[st];
    if(m)this.osc('square',this.f(m),t,this.SPB*0.92,0.045);          // メロディ
    const root=this.roots[Math.floor(st/8)];
    this.osc('triangle',this.f(root+(st%2?12:0)),t,this.SPB*0.85,0.07); // ベース
    if(st%2===0)this.osc('square',this.f(root+24)+3,t,this.SPB*0.3,0.011); // うすい刻み
  },
  start(){
    if(this.timer)return;
    SND.init();if(!SND.ac)return;
    this.step=0;this.nextT=SND.ac.currentTime+0.05;
    this.timer=setInterval(()=>{
      while(this.nextT<SND.ac.currentTime+0.18){
        this.playStep(this.step,this.nextT);
        this.step=(this.step+1)%64;
        this.nextT+=this.SPB;
      }
    },60);
  },
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null;}},
};

function confetti(x,y,n,spread){
  const cols=['#ffd54f','#4fc3f7','#e23b3b','#2fa14d','#ce93d8','#ffb74d'];
  for(let i=0;i<(n||24);i++){
    const d=document.createElement('div');d.className='cfp';
    d.style.left=x+'px';d.style.top=y+'px';
    d.style.background=cols[i%cols.length];
    document.body.appendChild(d);
    if(!d.animate){d.remove();continue;}
    const ang=Math.random()*Math.PI*2,v=(spread||90)*(0.4+Math.random());
    const tx=Math.cos(ang)*v,ty=Math.sin(ang)*v-60-Math.random()*90;
    d.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${tx}px,${ty+170}px) rotate(${Math.random()*720-360}deg)`,opacity:0}
    ],{duration:950+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();
  }
}

function moveEase(type,u){
  if(type==='train')return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2; // 強い加速→減速
  if(type==='zoom') return 1-Math.pow(1-u,2.6);                    // ダッと出て詰める
  if(type==='walk') return u;                                      // 等速(上下バウンドで表現)
  return u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;                       // なめらか
}
const PARTICLES=[];
function emitParticles(x,y,fx,mode,ux,uy,speed){
  const C=CV.cell,type=fx.part,now=performance.now();
  const bx=x-ux*C*0.5, by=y-uy*C*0.5+C*0.18;
  const n=(mode==='walk')?1:(speed>C*0.28?3:2);
  for(let i=0;i<n;i++){
    const p={x:bx+(Math.random()-.5)*C*0.3, y:by+(Math.random()-.5)*C*0.2, t0:now, life:400, vx:0, vy:0, type, size:C*0.15};
    if(type==='dust'){p.life=360;p.vy=-C*0.006;p.vx=-ux*C*0.008+(Math.random()-.5)*C*0.012;p.color='190,180,160';p.size=C*(0.10+Math.random()*0.08);}
    else if(type==='smoke'){p.life=520;p.vy=-C*0.013-Math.random()*C*0.008;p.vx=-ux*C*0.018+(Math.random()-.5)*C*0.008;p.color='120,126,138';p.size=C*(0.13+Math.random()*0.13);}
    else if(type==='steam'){p.life=560;p.vy=-C*0.02-Math.random()*C*0.01;p.vx=(Math.random()-.5)*C*0.012;p.color='232,234,240';p.size=C*(0.15+Math.random()*0.16);}
    else {p.life=440;const a=Math.random()*6.283;p.vx=Math.cos(a)*C*0.03;p.vy=Math.sin(a)*C*0.03;p.color='214,160,224';p.size=C*(0.06+Math.random()*0.08);}
    PARTICLES.push(p);
  }
  if(PARTICLES.length>140)PARTICLES.splice(0,PARTICLES.length-140);
}

    const _safety=setTimeout(_done, total+1000); // WebViewでrAFが止まっても移動を必ず確定させる
    const t0=performance.now();let lastSeg=-1,lastEmit=0,px=pts[0][0],py=pts[0][1];
    const tick=now=>{
      if(_fin)return;
      const rawU=Math.min(1,(now-t0)/total);
      const e=moveEase(fx.ease,rawU);
      const f=e*nSeg;
      const i=Math.min(nSeg-1,Math.floor(f)), k=f-i;
      const bx0=pts[i][0], by0=pts[i][1], dxr=pts[i+1][0]-bx0, dyr=pts[i+1][1]-by0;
      const x=bx0+dxr*k, base=by0+dyr*k;
      // 上下バウンド(徒歩=一歩ごとにピョン, ヘリ=ふわふわ)
      let bob=0;
      if(move.mode==='walk')bob=-Math.abs(Math.sin(k*Math.PI))*C*fx.bob;
      else if(fx.bob)bob=Math.sin(now/95)*C*fx.bob;
      const y=base+bob;
      const dir=Math.hypot(dxr,dyr)||1, ux=dxr/dir, uy=dyr/dir;
      const speed=Math.hypot(x-px,base-py);
      ANIM={pi,x,y,base,ux,uy,speed,f,fx,pts,mode:move.mode};
      if(now-lastEmit>32){lastEmit=now;emitParticles(x,base,fx,move.mode,ux,uy,speed);}
      if(i!==lastSeg){lastSeg=i;seStep(move.mode);}
      if(camFollowMode)camFollowXY(x,base);
      px=x;py=base;
      draw();
      if(rawU<1)requestAnimationFrame(tick);
      else{
        ANIM=null;
        LAND={x:pts[nSeg][0],y:pts[nSeg][1],t0:performance.now()};
        const lp=()=>{if(_fin)return;draw();
          const t=performance.now()-LAND.t0;
          if((t<360)|| (PARTICLES.length&&t<820))requestAnimationFrame(lp);
          else{_done();}};
        lp();
      }
    };
    requestAnimationFrame(tick);
  });
  await sleep(50);
}
// 徒歩換算の残り距離(BFS)
function walkDistUI(from,to){
  if(from===to)return 0;
  let q=[from];const seen=new Set(q);let d=0;
  while(q.length&&d<300){d++;const nq=[];
    for(const c of q)for(const nb of roadNeighbors(G.board,c)){
      const cc=nb.cell;if(seen.has(cc))continue;
      if(cc===to)return d;seen.add(cc);nq.push(cc);}
    q=nq;}
  return -1;
}
async function inspectPlayer(pi,silent){
  const p=G.players[pi];if(!p||!p.active)return;
  INSPECT={pi,until:Date.now()+2600};
  startPulse();
  setTimeout(()=>{if(INSPECT&&INSPECT.pi===pi){INSPECT=null;stopPulse();}},2650);
  if(!silent){
    seDraw();
    const a=p.active,d=walkDistUI(a.cell,a.dest);
    toast(`${p.name}「${a.card.name}」${a.card.tname} → ${a.destLabel}${d>=0?` あと${d}マス`:''}`,1900);
  }
}
function bindInspect(){

const CV={cell:0,pad:6,dpr:1,view:0};
const CAM={scale:1,ox:0,oy:0,tscale:1,tox:0,toy:0,anim:false};
let camFollowMode=false, camTimer=null;
function worldSize(){return CV.cell*(G?G.board.W:15)+CV.pad*2;}
function setupCanvas(){

}
function clampCam(){
  const view=CV.view||worldSize(), ws=worldSize()*CAM.scale;
  if(ws<=view+0.5){CAM.ox=(view-ws)/2;CAM.oy=(view-ws)/2;}
  else{CAM.ox=Math.min(0,Math.max(view-ws,CAM.ox));CAM.oy=Math.min(0,Math.max(view-ws,CAM.oy));}
}
function cellXY(cell){const [x,y]=cell.split(',').map(Number);return [CV.pad+x*CV.cell+CV.cell/2, CV.pad+y*CV.cell+CV.cell/2];}
function cellAt(px,py){

  if(Math.abs(CAM.tscale-CAM.scale)<0.008&&Math.abs(CAM.tox-CAM.ox)<0.6&&Math.abs(CAM.toy-CAM.oy)<0.6){

let _lastPanEnd=0;
function bindBoardInput(){

    else{_tapc=null;_pan=null;const p=[..._PTRS.values()];_pinch={d:_d(p[0],p[1]),mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2};}
  });
  cv.addEventListener('pointermove',e=>{ if(!_PTRS.has(e.pointerId))return;
    _PTRS.set(e.pointerId,{x:e.clientX,y:e.clientY});

      if(Math.hypot(e.clientX-_tapc.x,e.clientY-_tapc.y)>18)_tapc.moved=true; // 指のブレはタップとして許容
      if(_tapc.moved){CAM.anim=false;CAM.ox+=e.clientX-_pan.lx;CAM.oy+=e.clientY-_pan.ly;clampCam();draw();}
      _pan.lx=e.clientX;_pan.ly=e.clientY;
    } else if(_PTRS.size>=2&&_pinch){
      const p=[..._PTRS.values()],nd=_d(p[0],p[1]),nmx=(p[0].x+p[1].x)/2,nmy=(p[0].y+p[1].y)/2;
      const r=cv.getBoundingClientRect(),cx=nmx-r.left,cy=nmy-r.top;

      CAM.scale=ns;CAM.ox=cx-wx*ns+(nmx-_pinch.mx);CAM.oy=cy-wy*ns+(nmy-_pinch.my);
      _pinch={d:nd,mx:nmx,my:nmy};clampCam();draw();
    }
  });
  const end=e=>{

let pulseTimer=null,pulseCount=0;
function startPulse(){pulseCount++;if(!pulseTimer)pulseTimer=setInterval(()=>draw(),55);}
function stopPulse(){pulseCount=Math.max(0,pulseCount-1);
  if(!pulseCount&&pulseTimer){clearInterval(pulseTimer);pulseTimer=null;}draw();}
function draw(){
  if(!G)return;
  const B=G.board, cv=$('board'), ctx=cv.getContext('2d');
  const C=CV.cell, P=CV.pad, N=B.W, S=C*N+P*2;
  const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
  const _dpr=CV.dpr||1;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#e7ebef'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(_dpr*CAM.scale,0,0,_dpr*CAM.scale,_dpr*CAM.ox,_dpr*CAM.oy);
  // 盤面背景(明るく静かに)
  ctx.fillStyle='#f3f5f7'; ctx.fillRect(-6,-6,S+12,S+12);
  // 交通空白(ごく薄い紫)
  for(const cell of B.desert){const [cx,cy]=cellXY(cell);
    ctx.fillStyle='rgba(150,115,190,0.12)';
    ctx.fillRect(cx-C/2,cy-C/2,C,C);}
  // グリッド(かすか)
  ctx.strokeStyle='rgba(0,0,0,0.04)';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){
    ctx.beginPath();ctx.moveTo(P+i*C,P);ctx.lineTo(P+i*C,S-P);ctx.stroke();
    ctx.beginPath();ctx.moveTo(P,P+i*C);ctx.lineTo(S-P,P+i*C);ctx.stroke();
  }
  // 道路(細く・控えめな灰色)
  ctx.strokeStyle='#c6ccd4';ctx.lineWidth=Math.max(2,C*0.14);ctx.lineCap='round';
  for(const ek of B.edges){
    const [a,b]=ek.split('|');

    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  // バス路線(やわらかい帯+細い中心線)
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(41,182,246,0.16)';ctx.lineWidth=Math.max(5,C*0.4);
  ctx.beginPath();
  for(let i=0;i<=B.busLoop.length;i++){
    const [x,y]=cellXY(B.busLoop[i%B.busLoop.length]);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=Math.max(1.5,C*0.06);
  ctx.setLineDash([Math.max(3,C*0.22),Math.max(3,C*0.22)]);
  ctx.beginPath();
  for(let i=0;i<=B.busLoop.length;i++){
    const [x,y]=cellXY(B.busLoop[i%B.busLoop.length]);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.setLineDash([]);
  // 路線上を走るミニバス(何のラインか一目で分かるように)
  {
    ctx.font=(C*0.36)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=0.9;
    const stepN=Math.max(9,Math.floor(B.busLoop.length/7));
    for(let i=Math.floor(stepN/2);i<B.busLoop.length;i+=stepN){
      const cell=B.busLoop[i];
      if(B.stations.includes(cell)||B.houses.includes(cell)||B.busStopCells.includes(cell))continue;
      let sp=false;for(const k in B.facilities)if(B.facilities[k]===cell)sp=true;
      if(sp)continue;
      const [bx,by]=cellXY(cell);
      ctx.fillText('🚌',bx,by);
    }
    ctx.globalAlpha=1;
  }
  // 線路(二重レール+枕木で「線路らしく」)
  {
    const railCol='rgba(198,64,58,0.8)';
    const g=Math.max(1.6,C*0.06);      // レール間隔(中心から)
    for(const [u,v] of G.rail.edges){
      const [x1,y1]=cellXY(B.stations[u]),[x2,y2]=cellXY(B.stations[v]);
      const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
      const ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
      // 2本のレール
      ctx.strokeStyle=railCol;ctx.lineWidth=Math.max(1.2,C*0.045);ctx.lineCap='butt';
